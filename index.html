<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSS Unit JNGP - Polytechnic College Ramanthapur</title>
    <!-- PWA Manifest Meta Tags -->
    <meta name="theme-color" content="#1E3A8A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NSS JNGP">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
      %22name%22: %22NSS Unit JNGP%22,
      %22short_name%22: %22NSS JNGP%22,
      %22start_url%22: %22.%22,
      %22display%22: %22standalone%22,
      %22background_color%22: %22%23f0f4f8%22,
      %22theme_color%22: %22%231E3A8A%22,
      %22icons%22: [{
        %22src%22: %22https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=192%22,
        %22sizes%22: %22192x192%22,
        %22type%22: %22image/png%22
      }]
    }">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        .nss-gradient { background: linear-gradient(135deg, #0A192F 0%, #1E3A8A 50%, #2563EB 100%); }
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    </style>
</head>
<body id="app-body" class="min-h-screen bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 relative">
    <canvas id="bgCanvas"></canvas>
    <div id="app" class="relative z-10 max-w-md mx-auto min-h-screen bg-slate-50 dark:bg-slate-900 shadow-2xl flex flex-col overflow-hidden transition-colors duration-300">
        
        <!-- Welcome View -->
        <div id="view-landing" class="flex flex-col min-h-screen p-6 justify-between nss-gradient text-white">
            <div class="text-center pt-6 space-y-4">
                <div class="flex justify-center items-center gap-4 animate-bounce">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150" alt="NSS Emblem" class="w-20 h-20 rounded-full border-2 border-white shadow-lg object-cover bg-white">
                    <img src="https://images.unsplash.com/photo-1541339907198-e08756dedf3f?w=150" alt="JNGP Crest" class="w-20 h-20 rounded-full border-2 border-white shadow-lg object-cover bg-white">
                </div>
                <h1 class="text-2xl font-bold tracking-wide">NSS UNIT JNGP</h1>
                <p class="text-xs text-blue-200">Govt Polytechnic College, Ramanthapur</p>
                <div class="inline-block bg-white/20 px-3 py-1 rounded-full text-xs font-medium tracking-widest uppercase">
                    "Not Me, But You"
                </div>
            </div>

            <div class="my-6 bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/20">
                <p class="text-center text-xs uppercase tracking-wider text-blue-200 mb-3 font-semibold"><i class="fa-solid fa-handshake mr-1"></i> Official Collaborators & Partners</p>
                <div class="flex justify-around items-center gap-2">
                    <div class="bg-white/20 px-3 py-2 rounded-xl text-center flex-1">
                        <i class="fa-solid fa-seedling text-emerald-400 text-lg mb-1"></i>
                        <p class="text-[10px] font-medium">EcoGreen Corp</p>
                    </div>
                    <div class="bg-white/20 px-3 py-2 rounded-xl text-center flex-1">
                        <i class="fa-solid fa-laptop-code text-cyan-400 text-lg mb-1"></i>
                        <p class="text-[10px] font-medium">TechNova Labs</p>
                    </div>
                    <div class="bg-white/20 px-3 py-2 rounded-xl text-center flex-1">
                        <i class="fa-solid fa-heart-pulse text-rose-400 text-lg mb-1"></i>
                        <p class="text-[10px] font-medium">YouthCare NGO</p>
                    </div>
                </div>
            </div>

            <div class="space-y-3 pb-6">
                <button onclick="openSignInModal('board')" class="w-full bg-blue-600 hover:bg-blue-500 font-semibold py-3.5 px-6 rounded-xl shadow-lg transition flex items-center justify-center gap-3 border border-blue-400 cursor-pointer">
                    <i class="fa-solid fa-user-shield text-lg"></i> Board Member Sign In
                </button>
                <button onclick="openSignInModal('student')" class="w-full bg-white/10 hover:bg-white/20 font-semibold py-3.5 px-6 rounded-xl shadow-lg transition flex items-center justify-center gap-3 border border-white/30 cursor-pointer">
                    <i class="fa-solid fa-user-graduate text-lg"></i> Student Sign In / Register
                </button>
            </div>
        </div>

        <!-- Main Dashboard -->
        <div id="view-dashboard" class="hidden flex-col flex-1 pb-20">
            <div class="nss-gradient text-white p-4 rounded-b-3xl shadow-md flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100" class="w-10 h-10 rounded-full border border-white bg-white">
                    <div>
                        <h2 class="font-bold text-sm">NSS Unit JNGP</h2>
                        <p class="text-[10px] text-blue-200" id="user-role-badge">Role: Guest</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="toggleDarkMode()" class="bg-white/20 hover:bg-white/30 text-white text-xs px-2.5 py-1.5 rounded-lg transition cursor-pointer" title="Toggle Dark/Light Mode">
                        <i id="dark-mode-icon" class="fa-solid fa-moon"></i>
                    </button>
                    <button onclick="logout()" class="bg-red-500/85 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded-lg transition cursor-pointer">
                        <i class="fa-solid fa-power-off"></i>
                    </button>
                </div>
            </div>

            <div id="tab-content" class="p-4 flex-1 space-y-4"></div>

            <div class="fixed bottom-0 max-w-md w-full bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex justify-around py-3 px-2 shadow-lg z-20">
                <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-blue-600 dark:text-blue-400 text-xs font-semibold cursor-pointer">
                    <i class="fa-solid fa-house text-lg"></i> Home
                </button>
                <button onclick="switchTab('events')" id="nav-events" class="flex flex-col items-center text-slate-400 dark:text-slate-500 text-xs font-medium cursor-pointer">
                    <i class="fa-solid fa-calendar-days text-lg"></i> Events
                </button>
                <button onclick="switchTab('messages')" id="nav-messages" class="flex flex-col items-center text-slate-400 dark:text-slate-500 text-xs font-medium cursor-pointer">
                    <i class="fa-solid fa-bullhorn text-lg"></i> Notices
                </button>
                <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-slate-400 dark:text-slate-500 text-xs font-medium cursor-pointer">
                    <i class="fa-solid fa-id-card text-lg"></i> Directory
                </button>
            </div>
        </div>
    </div>

    <!-- Sign In Modal -->
    <div id="signin-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 relative">
            <button onclick="closeSignInModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:text-slate-300 text-xl cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="modal-title" class="text-lg font-bold text-slate-800 dark:text-slate-100">Sign In</h3>
            <div id="modal-body" class="space-y-3"></div>
        </div>
    </div>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, addDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgYi6crYP7Em-z32TeIjHpUPfLGMNWFDY",
            authDomain: "nss-unit-jngp.firebaseapp.com",
            projectId: "nss-unit-jngp",
            storageBucket: "nss-unit-jngp.firebasestorage.app",
            messagingSenderId: "827655385529",
            appId: "1:827655385529:web:6df3292b78aef040a68668",
            measurementId: "G-294DT88D4R"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = JSON.parse(localStorage.getItem('nss_current_user')) || null;
        let isDarkMode = localStorage.getItem('nss_dark_mode') === 'true';
        let students = [];
        let messages = [];
        let events = [];
        let gallery = [];
        let currentActiveTab = 'home';
        let tempEventImageBase64 = '';
        let tempGalleryImageBase64 = '';

        function applyDarkMode() {
            const body = document.getElementById('app-body');
            const icon = document.getElementById('dark-mode-icon');
            if (isDarkMode) {
                body.classList.add('dark');
                if (icon) icon.className = "fa-solid fa-sun text-amber-300";
            } else {
                body.classList.remove('dark');
                if (icon) icon.className = "fa-solid fa-moon";
            }
        }

        window.toggleDarkMode = function() {
            isDarkMode = !isDarkMode;
            localStorage.setItem('nss_dark_mode', isDarkMode);
            applyDarkMode();
        };

        applyDarkMode();

        function initRealtimeSync() {
            onSnapshot(collection(db, "students"), (snapshot) => {
                students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if (currentUser && currentUser.role === 'student') {
                    const updatedMe = students.find(s => s.pin === currentUser.pin);
                    if (updatedMe) {
                        currentUser = { role: 'student', ...updatedMe };
                        localStorage.setItem('nss_current_user', JSON.stringify(currentUser));
                    }
                }
                refreshActiveTab();
            });

            onSnapshot(collection(db, "messages"), (snapshot) => {
                messages = snapshot.docs.map(doc => doc.data());
                refreshActiveTab();
            });

            onSnapshot(collection(db, "events"), (snapshot) => {
                events = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                refreshActiveTab();
            });

            onSnapshot(collection(db, "gallery"), (snapshot) => {
                gallery = snapshot.docs.map(doc => doc.data());
                refreshActiveTab();
            });
        }

        function refreshActiveTab() {
            const content = document.getElementById('tab-content');
            if (content && document.getElementById('view-dashboard').classList.contains('hidden') === false) {
                if (currentActiveTab === 'home') renderHomeTab(content);
                else if (currentActiveTab === 'events') renderEventsTab(content);
                else if (currentActiveTab === 'messages') renderMessagesTab(content);
                else if (currentActiveTab === 'profile') renderProfileTab(content);
            }
        }

        initRealtimeSync();

        window.openSignInModal = function(type) {
            const modal = document.getElementById('signin-modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            modal.classList.remove('hidden');

            if (type === 'board') {
                title.innerText = 'Board Member Secure Access';
                body.innerHTML = `
                    <p class="text-xs text-slate-500 dark:text-slate-400">Enter secure board PIN code</p>
                    <input type="password" id="board-pin" placeholder="Enter Secure PIN" class="w-full px-4 py-3 border dark:border-slate-700 dark:bg-slate-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600">
                    <button onclick="window.verifyBoardPin()" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl shadow cursor-pointer">Login as Board Member</button>
                `;
            } else {
                title.innerText = 'Student Sign In / Register';
                body.innerHTML = `
                    <p class="text-xs text-slate-500 dark:text-slate-400">Enter your assigned Student PIN (e.g. 24EEE01)</p>
                    <input type="text" id="student-pin" placeholder="Enter Student PIN" class="w-full px-4 py-3 border dark:border-slate-700 dark:bg-slate-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 uppercase">
                    <button onclick="window.verifyStudentPin()" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl shadow cursor-pointer">Student Portal Login</button>
                `;
            }
        };

        window.closeSignInModal = function() {
            document.getElementById('signin-modal').classList.add('hidden');
        };

        window.verifyBoardPin = function() {
            const pin = document.getElementById('board-pin').value;
            if (pin === '1947') {
                currentUser = { role: 'board', name: 'Board Member' };
                localStorage.setItem('nss_current_user', JSON.stringify(currentUser));
                window.closeSignInModal();
                showDashboard();
            } else {
                alert('Invalid Board PIN!');
            }
        };

        window.verifyStudentPin = async function() {
            const pin = document.getElementById('student-pin').value.trim().toUpperCase();
            const studentRef = doc(db, "students", pin);
            const studentSnap = await getDoc(studentRef);

            if (studentSnap.exists()) {
                currentUser = { role: 'student', id: studentSnap.id, ...studentSnap.data() };
                localStorage.setItem('nss_current_user', JSON.stringify(currentUser));
                window.closeSignInModal();
                showDashboard();
            } else {
                alert('PIN not found in Firebase! Please ask board members to register your PIN first.');
            }
        };

        window.logout = function() {
            currentUser = null;
            localStorage.removeItem('nss_current_user');
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-landing').classList.remove('hidden');
        };

        function showDashboard() {
            document.getElementById('view-landing').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
            document.getElementById('user-role-badge').innerText = `Role: ${currentUser.role === 'board' ? 'Board Member' : 'Student (' + currentUser.branch + ')'}`;
            window.switchTab('home');
        }

        window.switchTab = function(tab) {
            currentActiveTab = tab;
            ['home', 'events', 'messages', 'profile'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) btn.className = t === tab ? 'flex flex-col items-center text-blue-600 dark:text-blue-400 text-xs font-semibold cursor-pointer' : 'flex flex-col items-center text-slate-400 dark:text-slate-500 text-xs font-medium cursor-pointer';
            });

            const content = document.getElementById('tab-content');
            if (tab === 'home') renderHomeTab(content);
            else if (tab === 'events') renderEventsTab(content);
            else if (tab === 'messages') renderMessagesTab(content);
            else if (tab === 'profile') renderProfileTab(content);
        };

        function renderHomeTab(container) {
            if (currentUser.role === 'board') {
                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="bg-blue-50 dark:bg-slate-800 border border-blue-200 dark:border-slate-700 p-4 rounded-2xl">
                            <h3 class="font-bold text-blue-900 dark:text-blue-300 text-sm mb-1"><i class="fa-solid fa-shield-halved mr-1"></i> Board Control Center</h3>
                            <p class="text-xs text-blue-700 dark:text-blue-300">Take instant bulk attendance by branch, upload event banners/proofs directly from phone files, and manage cloud database.</p>
                        </div>
                        
                        <!-- Bulk Attendance Section -->
                        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border dark:border-slate-700 space-y-3">
                            <h4 class="font-semibold text-xs text-slate-700 dark:text-slate-200 uppercase tracking-wider"><i class="fa-solid fa-clipboard-user mr-1 text-blue-600"></i> Fast Bulk Attendance</h4>
                            <input type="date" id="att-date" class="w-full px-3 py-2 text-xs border dark:border-slate-700 dark:bg-slate-900 rounded-lg" value="${new Date().toISOString().split('T')[0]}">
                            
                            <select id="att-branch-filter" onchange="window.loadBranchStudentsForAttendance()" class="w-full px-3 py-2 text-xs border dark:border-slate-700 dark:bg-slate-900 rounded-lg font-medium text-slate-700 dark:text-slate-200">
                                <option value="">-- Select Branch to Load Students --</option>
                                <option value="EEE">EEE</option>
                                <option value="CSE">CSE</option>
                                <option value="ECE">ECE</option>
                                <option value="Mechanical">Mechanical</option>
                                <option value="Civil">Civil</option>
                                <option value="Chemical">Chemical</option>
                            </select>

                            <div id="bulk-attendance-container" class="space-y-2 max-h-60 overflow-y-auto border dark:border-slate-700 p-2 rounded-xl bg-slate-50 dark:bg-slate-900">
                                <p class="text-xs text-slate-400 text-center py-2">Select a branch above to view students.</p>
                            </div>

                            <button id="btn-submit-bulk" onclick="window.submitBulkAttendance()" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs py-2.5 rounded-lg font-medium cursor-pointer transition hidden">Submit All Attendance at Once</button>
                        </div>

                        <!-- Add Event Section (With File Image Uploader) -->
                        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border dark:border-slate-700 space-y-3">
                            <h4 class="font-semibold text-xs text-slate-700 dark:text-slate-200 uppercase tracking-wider"><i class="fa-solid fa-calendar-plus mr-1 text-purple-600"></i> Add Upcoming Event / Campaign</h4>
                            <input type="text" id="ev-name" placeholder="Event Name (e.g. Blood Donation Camp)" class="w-full px-3 py-2 text-xs border dark:border-slate-700 dark:bg-slate-900 rounded-lg">
                            <input type="date" id="ev-date" class="w-full px-3 py-2 text-xs border dark:border-slate-700 dark:bg-slate-900 rounded-lg">
                            <input type="text" id="ev-venue" placeholder="Venue (e.g. Main Auditorium)" class="w-full px-3 py-2 text-xs border dark:border-slate-700 dark:bg-slate-900 rounded-lg">
                            <input type="text" id="ev-time" placeholder="Time (e.g. 10:00 AM)" class="w-full px-3 py-2 text-xs border dark:border-slate-700 dark:bg-slate-900 rounded-lg">
                            <input type="url" id="ev-link" placeholder="Registration Website Link" class="w-full px-3 py-2 text-xs border dark:border-slate-700 dark:bg-slate-900 rounded-lg">
                            
                            <div class="space-y-1">
                                <label class="text-[11px] font-semibold text-slate-600 dark:text-slate-400">Upload Event Banner Image from File:</label>
                                <input type="file" id="ev-file-input" accept="image/*" onchange="window.handleEventImageFile(event)" class="w-full text-xs text-slate-500 dark:text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100 dark:file:bg-slate-700 dark:file:text-slate-200 cursor-pointer">
                            </div>
                            <button id="btn-add-ev" onclick="window.addEvent()" class="w-full bg-purple-600 hover:bg-purple-700 text-white text-xs py-2.5 rounded-lg font-medium cursor-pointer transition">Publish Event to Cloud</button>
                        </div>

                        <!-- Upload Event Gallery (With File Image Uploader) -->
                        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border dark:border-slate-700 space-y-3">
                            <h4 class="font-semibold text-xs text-slate-700 dark:text-slate-200 uppercase tracking-wider"><i class="fa-solid fa-images mr-1 text-amber-600"></i> Upload Event Gallery / Proof</h4>
                            <input type="text" id="gal-title" placeholder="Activity Title" class="w-full px-3 py-2 text-xs border dark:border-slate-700 dark:bg-slate-900 rounded-lg">
                            
                            <div class="space-y-1">
                                <label class="text-[11px] font-semibold text-slate-600 dark:text-slate-400">Upload Proof Photo from File:</label>
                                <input type="file" id="gal-file-input" accept="image/*" onchange="window.handleGalleryImageFile(event)" class="w-full text-xs text-slate-500 dark:text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100 dark:file:bg-slate-700 dark:file:text-slate-200 cursor-pointer">
                            </div>
                            <button id="btn-add-gal" onclick="window.addGalleryItem()" class="w-full bg-amber-600 hover:bg-amber-700 text-white text-xs py-2.5 rounded-lg font-medium cursor-pointer transition">Upload to Gallery</button>
                        </div>

                        <!-- Add Student Section -->
                        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border dark:border-slate-700 space-y-3">
                            <h4 class="font-semibold text-xs text-slate-700 dark:text-slate-200 uppercase tracking-wider"><i class="fa-solid fa-user-plus mr-1 text-emerald-600"></i> Add New Student</h4>
                            <input type="text" id="new-name" placeholder="Student Full Name" class="w-full px-3 py-2 text-xs border dark:border-slate-700 dark:bg-slate-900 rounded-lg">
                            <input type="text" id="new-pin" placeholder="PIN Number (e.g., 24CSE05)" class="w-full px-3 py-2 text-xs border dark:border-slate-700 dark:bg-slate-900 rounded-lg uppercase">
                            <select id="new-branch" class="w-full px-3 py-2 text-xs border dark:border-slate-700 dark:bg-slate-900 rounded-lg">
                                <option value="EEE">EEE</option><option value="CSE">CSE</option><option value="ECE">ECE</option>
                                <option value="Mechanical">Mechanical</option><option value="Civil">Civil</option><option value="Chemical">Chemical</option>
                            </select>
                            <button id="btn-add-stu" onclick="window.addStudent()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs py-2.5 rounded-lg font-medium cursor-pointer transition">Save Student to Database</button>
                        </div>

                        <!-- Post Announcement Section -->
                        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border dark:border-slate-700 space-y-3">
                            <h4 class="font-semibold text-xs text-slate-700 dark:text-slate-200 uppercase tracking-wider"><i class="fa-solid fa-bullhorn mr-1 text-indigo-600"></i> Post Live Announcement</h4>
                            <input type="text" id="msg-title" placeholder="Announcement Title" class="w-full px-3 py-2 text-xs border dark:border-slate-700 dark:bg-slate-900 rounded-lg">
                            <textarea id="msg-content" placeholder="Message details..." class="w-full px-3 py-2 text-xs border dark:border-slate-700 dark:bg-slate-900 rounded-lg"></textarea>
                            <button id="btn-post-msg" onclick="window.postMessage()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs py-2.5 rounded-lg font-medium cursor-pointer transition">Broadcast to Cloud</button>
                        </div>
                    </div>
                `;
            } else {
                let attendanceListHtml = '';
                const userAtt = currentUser.attendance || {};
                let totalClasses = Object.keys(userAtt).length;
                let presentCount = 0;
                let absentCount = 0;

                for (const [date, status] of Object.entries(userAtt)) {
                    if (status === 'Present') presentCount++;
                    else absentCount++;

                    attendanceListHtml += `
                        <div class="p-2.5 bg-slate-50 dark:bg-slate-900 rounded-xl flex justify-between items-center text-xs">
                            <span class="font-medium text-slate-700 dark:text-slate-300"><i class="fa-solid fa-calendar mr-1 text-blue-500"></i> ${date}</span>
                            <span class="px-2 py-0.5 rounded text-[10px] font-semibold ${status === 'Present' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900 dark:text-emerald-300' : 'bg-rose-100 text-rose-700 dark:bg-rose-900 dark:text-rose-300'}">${status}</span>
                        </div>
                    `;
                }
                if (!attendanceListHtml) {
                    attendanceListHtml = `<p class="text-xs text-slate-400 text-center py-2">No attendance records logged yet.</p>`;
                }

                let percentage = totalClasses > 0 ? Math.round((presentCount / totalClasses) * 100) : 0;

                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="nss-gradient text-white p-5 rounded-2xl shadow-lg space-y-2">
                            <p class="text-xs text-blue-200">Welcome back,</p>
                            <h3 class="text-lg font-bold">${currentUser.name}</h3>
                            <div class="flex gap-2 pt-2">
                                <span class="bg-white/20 px-2.5 py-1 rounded-md text-[10px] font-medium">PIN: ${currentUser.pin}</span>
                                <span class="bg-white/20 px-2.5 py-1 rounded-md text-[10px] font-medium">Branch: ${currentUser.branch}</span>
                            </div>
                        </div>

                        <!-- Attendance Analysis Report Card -->
                        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border dark:border-slate-700 space-y-3">
                            <h4 class="font-semibold text-xs text-slate-700 dark:text-slate-200 uppercase tracking-wider"><i class="fa-solid fa-chart-pie text-blue-600 mr-1"></i> Attendance Analysis Report</h4>
                            <div class="grid grid-cols-3 gap-2 text-center">
                                <div class="bg-blue-50 dark:bg-slate-900 p-3 rounded-xl">
                                    <p class="text-[10px] text-slate-500 dark:text-slate-400 font-medium">Total Classes</p>
                                    <p class="text-base font-bold text-blue-900 dark:text-blue-300">${totalClasses}</p>
                                </div>
                                <div class="bg-emerald-50 dark:bg-slate-900 p-3 rounded-xl">
                                    <p class="text-[10px] text-slate-500 dark:text-slate-400 font-medium">Days Present</p>
                                    <p class="text-base font-bold text-emerald-700 dark:text-emerald-400">${presentCount}</p>
                                </div>
                                <div class="bg-rose-50 dark:bg-slate-900 p-3 rounded-xl">
                                    <p class="text-[10px] text-slate-500 dark:text-slate-400 font-medium">Days Absent</p>
                                    <p class="text-base font-bold text-rose-700 dark:text-rose-400">${absentCount}</p>
                                </div>
                            </div>
                            <div class="space-y-1">
                                <div class="flex justify-between text-xs font-semibold">
                                    <span class="text-slate-600 dark:text-slate-300">Attendance Percentage</span>
                                    <span class="${percentage >= 75 ? 'text-emerald-600' : 'text-amber-600'}">${percentage}%</span>
                                </div>
                                <div class="w-full bg-slate-100 dark:bg-slate-900 h-2 rounded-full overflow-hidden">
                                    <div class="bg-blue-600 h-full rounded-full transition-all duration-500" style="width: ${percentage}%"></div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border dark:border-slate-700 space-y-3">
                            <h4 class="font-semibold text-xs text-slate-700 dark:text-slate-200 uppercase tracking-wider">Detailed Daily Logs</h4>
                            <div class="space-y-2 max-h-60 overflow-y-auto">
                                ${attendanceListHtml}
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        window.handleEventImageFile = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                tempEventImageBase64 = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.handleGalleryImageFile = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                tempGalleryImageBase64 = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.loadBranchStudentsForAttendance = function() {
            const branch = document.getElementById('att-branch-filter').value;
            const container = document.getElementById('bulk-attendance-container');
            const submitBtn = document.getElementById('btn-submit-bulk');
            if (!container) return;

            if (!branch) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">Select a branch above to view students.</p>`;
                if (submitBtn) submitBtn.classList.add('hidden');
                return;
            }

            const filtered = students.filter(s => s.branch === branch);
            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">No students found in ${branch}.</p>`;
                if (submitBtn) submitBtn.classList.add('hidden');
                return;
            }

            let html = '';
            filtered.forEach(s => {
                html += `
                    <div class="flex justify-between items-center bg-white dark:bg-slate-800 p-2 rounded-lg border dark:border-slate-700 text-xs">
                        <div>
                            <p class="font-bold text-slate-800 dark:text-slate-200">${s.name}</p>
                            <p class="text-[10px] text-slate-500 dark:text-slate-400">${s.pin}</p>
                        </div>
                        <select id="bulk-status-${s.pin}" class="px-2 py-1 text-xs border dark:border-slate-600 dark:bg-slate-900 rounded font-semibold text-emerald-600 dark:text-emerald-400">
                            <option value="Present" selected>Present</option>
                            <option value="Absent">Absent</option>
                        </select>
                    </div>
                `;
            });

            container.innerHTML = html;
            if (submitBtn) submitBtn.classList.remove('hidden');
            container.dataset.branchStudents = JSON.stringify(filtered.map(s => s.pin));
        };

        window.submitBulkAttendance = async function() {
            const dateInput = document.getElementById('att-date');
            const container = document.getElementById('bulk-attendance-container');
            const btn = document.getElementById('btn-submit-bulk');
            if (!dateInput || !container || !container.dataset.branchStudents) return;

            const date = dateInput.value;
            if (!date) {
                alert('Please pick a date for attendance.');
                return;
            }

            const pins = JSON.parse(container.dataset.branchStudents);
            if (pins.length === 0) return;

            if (btn) btn.disabled = true;
            try {
                for (const pin of pins) {
                    const statusSelect = document.getElementById(`bulk-status-${pin}`);
                    const status = statusSelect ? statusSelect.value : 'Present';
                    
                    const studentDoc = students.find(s => s.pin === pin);
                    if (studentDoc) {
                        let updatedAttendance = studentDoc.attendance || {};
                        updatedAttendance[date] = status;
                        await updateDoc(doc(db, "students", pin), {
                            attendance: updatedAttendance
                        });
                    }
                }
                alert('All students attendance submitted successfully to cloud!');
            } catch (error) {
                console.error("Bulk attendance error: ", error);
                alert('Failed to submit attendance.');
            } finally {
                if (btn) btn.disabled = false;
            }
        };

        function renderEventsTab(container) {
            let eventsHtml = `<div class="space-y-3"><h3 class="font-bold text-sm text-slate-700 dark:text-slate-200"><i class="fa-solid fa-calendar-star text-purple-600 mr-1"></i> Upcoming Events & Registration</h3>`;
            if (events.length === 0) {
                eventsHtml += `<p class="text-xs text-slate-400 text-center py-2">No upcoming events posted yet.</p>`;
            } else {
                events.forEach(e => {
                    eventsHtml += `
                        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border dark:border-slate-700 space-y-2">
                            ${e.imageUrl ? `<img src="${e.imageUrl}" class="w-full h-40 object-cover rounded-xl mb-2 border dark:border-slate-700" alt="Event Banner">` : ''}
                            <div class="flex justify-between items-center">
                                <h4 class="font-bold text-xs text-blue-900 dark:text-blue-300">${e.name}</h4>
                                <span class="text-[10px] bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300 px-2 py-0.5 rounded font-medium">${e.date}</span>
                            </div>
                            <p class="text-xs text-slate-500 dark:text-slate-400"><i class="fa-solid fa-location-dot mr-1"></i> ${e.venue} | <i class="fa-solid fa-clock ml-1"></i> ${e.time}</p>
                            ${e.link ? `<a href="${e.link}" target="_blank" class="inline-block mt-1 bg-blue-600 text-white text-[10px] px-3 py-2 rounded-lg font-medium hover:bg-blue-700 transition w-full text-center"><i class="fa-solid fa-external-link-alt mr-1"></i> Register / Open Event Website Link</a>` : ''}
                        </div>
                    `;
                });
            }
            eventsHtml += `</div>`;

            let galleryHtml = `<div class="space-y-3 mt-6"><h3 class="font-bold text-sm text-slate-700 dark:text-slate-200"><i class="fa-solid fa-images text-amber-600 mr-1"></i> Event Photo Gallery & Proofs</h3>`;
            if (gallery.length === 0) {
                galleryHtml += `<p class="text-xs text-slate-400 text-center py-2">No gallery proofs uploaded yet.</p>`;
            } else {
                galleryHtml += `<div class="grid grid-cols-2 gap-2">`;
                gallery.forEach(g => {
                    galleryHtml += `
                        <div class="bg-white dark:bg-slate-800 p-2 rounded-xl border dark:border-slate-700 shadow-sm space-y-1">
                            <img src="${g.imageUrl}" class="w-full h-28 object-cover rounded-lg border dark:border-slate-700" alt="Proof Photo">
                            <p class="text-[11px] font-semibold text-slate-700 dark:text-slate-300 truncate">${g.title}</p>
                        </div>
                    `;
                });
                galleryHtml += `</div>`;
            }
            galleryHtml += `</div>`;

            container.innerHTML = eventsHtml + galleryHtml;
        }

        function renderMessagesTab(container) {
            let html = `<div class="space-y-3"><h3 class="font-bold text-sm text-slate-700 dark:text-slate-200">Notice Board & Announcements</h3>`;
            if (messages.length === 0) {
                html += `<p class="text-xs text-slate-400 text-center py-4">No announcements posted yet.</p>`;
            } else {
                messages.forEach(m => {
                    html += `
                        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border dark:border-slate-700 space-y-1">
                            <div class="flex justify-between items-center"><h4 class="font-bold text-xs text-slate-800 dark:text-slate-200">${m.title}</h4><span class="text-[10px] text-slate-400">${m.date}</span></div>
                            <p class="text-xs text-slate-600 dark:text-slate-300">${m.content}</p>
                        </div>
                    `;
                });
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderProfileTab(container) {
            container.innerHTML = `
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border dark:border-slate-700 space-y-3">
                    <h3 class="font-bold text-sm text-slate-700 dark:text-slate-200">Firebase Student Directory</h3>
                    <div class="space-y-2 max-h-96 overflow-y-auto">
                        ${students.map(s => `
                            <div class="p-3 bg-slate-50 dark:bg-slate-900 rounded-xl flex justify-between items-center text-xs">
                                <div>
                                    <p class="font-bold text-slate-800 dark:text-slate-200">${s.name}</p>
                                    <p class="text-[10px] text-slate-500 dark:text-slate-400">${s.pin} •${s.branch}</p>
                                </div>
                                <span class="bg-emerald-100 dark:bg-emerald-900 text-emerald-700 dark:text-emerald-300 px-2 py-0.5 rounded text-[10px]">Active</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.addStudent = async function() {
            const btn = document.getElementById('btn-add-stu');
            const name = document.getElementById('new-name').value.trim();
            const pin = document.getElementById('new-pin').value.trim().toUpperCase();
            const branch = document.getElementById('new-branch').value;

            if (!name || !pin) {
                alert('Please enter both name and PIN');
                return;
            }

            if (btn) btn.disabled = true;
            try {
                await setDoc(doc(db, "students", pin), {
                    name: name,
                    pin: pin,
                    branch: branch,
                    attendance: {}
                });
                alert('Student successfully saved to Firebase!');
                document.getElementById('new-name').value = '';
                document.getElementById('new-pin').value = '';
            } catch (error) {
                console.error("Error adding student: ", error);
                alert('Failed to add student.');
            } finally {
                if (btn) btn.disabled = false;
            }
        };

        window.addEvent = async function() {
            const btn = document.getElementById('btn-add-ev');
            const name = document.getElementById('ev-name').value.trim();
            const date = document.getElementById('ev-date').value;
            const venue = document.getElementById('ev-venue').value.trim();
            const time = document.getElementById('ev-time').value.trim();
            const link = document.getElementById('ev-link').value.trim();

            if (!name || !date || !venue || !time) {
                alert('Please fill in Name, Date, Venue, and Time.');
                return;
            }

            if (btn) btn.disabled = true;
            try {
                await addDoc(collection(db, "events"), {
                    name,
                    date,
                    venue,
                    time,
                    link,
                    imageUrl: tempEventImageBase64
                });
                alert('Upcoming event published successfully!');
                document.getElementById('ev-name').value = '';
                document.getElementById('ev-date').value = '';
                document.getElementById('ev-venue').value = '';
                document.getElementById('ev-time').value = '';
                document.getElementById('ev-link').value = '';
                document.getElementById('ev-file-input').value = '';
                tempEventImageBase64 = '';
            } catch (error) {
                console.error("Error adding event: ", error);
                alert('Failed to publish event.');
            } finally {
                if (btn) btn.disabled = false;
            }
        };

        window.addGalleryItem = async function() {
            const btn = document.getElementById('btn-add-gal');
            const title = document.getElementById('gal-title').value.trim();

            if (!title) {
                alert('Please enter a gallery title.');
                return;
            }

            if (btn) btn.disabled = true;
            try {
                await addDoc(collection(db, "gallery"), {
                    title,
                    imageUrl: tempGalleryImageBase64
                });
                alert('Event gallery photo uploaded successfully!');
                document.getElementById('gal-title').value = '';
                document.getElementById('gal-file-input').value = '';
                tempGalleryImageBase64 = '';
            } catch (error) {
                console.error("Error uploading gallery: ", error);
                alert('Failed to upload proof photo.');
            } finally {
                if (btn) btn.disabled = false;
            }
        };

        window.postMessage = async function() {
            const btn = document.getElementById('btn-post-msg');
            const title = document.getElementById('msg-title').value.trim();
            const content = document.getElementById('msg-content').value.trim();
            if (!title || !content) {
                alert('Please fill in all announcement fields');
                return;
            }

            if (btn) btn.disabled = true;
            try {
                await addDoc(collection(db, "messages"), {
                    title: title,
                    content: content,
                    date: new Date().toISOString().split('T')[0]
                });
                alert('Announcement broadcasted successfully!');
                document.getElementById('msg-title').value = '';
                document.getElementById('msg-content').value = '';
            } catch (error) {
                console.error("Error posting message: ", error);
                alert('Failed to post announcement.');
            } finally {
                if (btn) btn.disabled = false;
            }
        };

        window.onload = function() {
            if (currentUser) {
                showDashboard();
            }
        };
    </script>
</body>
</html>

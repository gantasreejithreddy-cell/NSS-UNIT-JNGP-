    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, addDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgYi6crYP7Em-z32TeIjHpUPfLGMNWFDY",
            authDomain: "nss-unit-jngp.firebaseapp.com",
            projectId: "nss-unit-jngp",
            storageBucket: "nss-unit-jngp.firebasestorage.app",
            messagingSenderId: "827655385529",
            appId: "1:827655385529:web:6df3292b78aef040a68668",
            measurementId: "G-294DT88D4R"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = JSON.parse(localStorage.getItem('nss_current_user')) || null;
        let students = [];
        let messages = [];
        let events = [];
        let currentActiveTab = 'home';

        function initRealtimeSync() {
            onSnapshot(collection(db, "students"), (snapshot) => {
                students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if (currentUser && currentUser.role === 'student') {
                    const updatedMe = students.find(s => s.pin === currentUser.pin);
                    if (updatedMe) {
                        currentUser = { role: 'student', ...updatedMe };
                        localStorage.setItem('nss_current_user', JSON.stringify(currentUser));
                    }
                }
                refreshActiveTab();
            });

            onSnapshot(collection(db, "messages"), (snapshot) => {
                messages = snapshot.docs.map(doc => doc.data());
                refreshActiveTab();
            });

            onSnapshot(collection(db, "events"), (snapshot) => {
                events = snapshot.docs.map(doc => doc.data());
                refreshActiveTab();
            });
        }

        function refreshActiveTab() {
            const content = document.getElementById('tab-content');
            if (content && document.getElementById('view-dashboard').classList.contains('hidden') === false) {
                if (currentActiveTab === 'home') renderHomeTab(content);
                else if (currentActiveTab === 'events') renderEventsTab(content);
                else if (currentActiveTab === 'messages') renderMessagesTab(content);
                else if (currentActiveTab === 'profile') renderProfileTab(content);
            }
        }

        initRealtimeSync();

        window.openSignInModal = function(type) {
            const modal = document.getElementById('signin-modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            modal.classList.remove('hidden');

            if (type === 'board') {
                title.innerText = 'Board Member Secure Access';
                body.innerHTML = `
                    <p class="text-xs text-slate-500">Enter secure board PIN code (Hidden for security)</p>
                    <input type="password" id="board-pin" placeholder="Enter Secure PIN" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600">
                    <button onclick="window.verifyBoardPin()" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl shadow cursor-pointer">Login as Board Member</button>
                `;
            } else {
                title.innerText = 'Student Sign In / Sign Up';
                body.innerHTML = `
                    <p class="text-xs text-slate-500">Enter your assigned Student PIN (e.g. 24EEE01)</p>
                    <input type="text" id="student-pin" placeholder="Enter Student PIN" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 uppercase">
                    <button onclick="window.verifyStudentPin()" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl shadow cursor-pointer">Student Portal Login</button>
                `;
            }
        };

        window.closeSignInModal = function() {
            document.getElementById('signin-modal').classList.add('hidden');
        };

        window.verifyBoardPin = function() {
            const pin = document.getElementById('board-pin').value;
            if (pin === '1947') {
                currentUser = { role: 'board', name: 'Board Member' };
                localStorage.setItem('nss_current_user', JSON.stringify(currentUser));
                window.closeSignInModal();
                showDashboard();
            } else {
                alert('Invalid Board PIN!');
            }
        };

        window.verifyStudentPin = async function() {
            const pin = document.getElementById('student-pin').value.trim().toUpperCase();
            const studentRef = doc(db, "students", pin);
            const studentSnap = await getDoc(studentRef);

            if (studentSnap.exists()) {
                currentUser = { role: 'student', id: studentSnap.id, ...studentSnap.data() };
                localStorage.setItem('nss_current_user', JSON.stringify(currentUser));
                window.closeSignInModal();
                showDashboard();
            } else {
                alert('PIN not found in Firebase! Please ask board members to register your PIN first.');
            }
        };

        window.logout = function() {
            currentUser = null;
            localStorage.removeItem('nss_current_user');
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-landing').classList.remove('hidden');
        };

        function showDashboard() {
            document.getElementById('view-landing').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
            document.getElementById('user-role-badge').innerText = `Role: ${currentUser.role === 'board' ? 'Board Member' : 'Student (' + currentUser.branch + ')'}`;
            window.switchTab('home');
        }

        window.switchTab = function(tab) {
            currentActiveTab = tab;
            ['home', 'events', 'messages', 'profile'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) btn.className = t === tab ? 'flex flex-col items-center text-blue-600 text-xs font-semibold cursor-pointer' : 'flex flex-col items-center text-slate-400 text-xs font-medium cursor-pointer';
            });

            const content = document.getElementById('tab-content');
            if (tab === 'home') renderHomeTab(content);
            else if (tab === 'events') renderEventsTab(content);
            else if (tab === 'messages') renderMessagesTab(content);
            else if (tab === 'profile') renderProfileTab(content);
        };

        function renderHomeTab(container) {
            if (currentUser.role === 'board') {
                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="bg-blue-50 border border-blue-200 p-4 rounded-2xl">
                            <h3 class="font-bold text-blue-900 text-sm mb-1"><i class="fa-solid fa-shield-halved mr-1"></i> Board Control Center</h3>
                            <p class="text-xs text-blue-700">Manage cloud students database, take attendance by branch, add events, and post announcements.</p>
                        </div>
                        
                        <!-- Attendance Section (Branch-First) -->
                        <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
                            <h4 class="font-semibold text-xs text-slate-700 uppercase tracking-wider"><i class="fa-solid fa-clipboard-user mr-1 text-blue-600"></i> Take Daily Attendance</h4>
                            <input type="date" id="att-date" class="w-full px-3 py-2 text-xs border rounded-lg" value="${new Date().toISOString().split('T')[0]}">
                            
                            <!-- Select Branch First -->
                            <select id="att-branch-filter" onchange="window.filterAttendanceStudents()" class="w-full px-3 py-2 text-xs border rounded-lg font-medium text-slate-700">
                                <option value="">-- Select Branch First --</option>
                                <option value="EEE">EEE</option>
                                <option value="CSE">CSE</option>
                                <option value="ECE">ECE</option>
                                <option value="Mechanical">Mechanical</option>
                                <option value="Civil">Civil</option>
                                <option value="Chemical">Chemical</option>
                            </select>

                            <!-- Filtered Student Dropdown -->
                            <select id="att-student-pin" class="w-full px-3 py-2 text-xs border rounded-lg">
                                <option value="">-- Select Branch Above First --</option>
                            </select>

                            <select id="att-status" class="w-full px-3 py-2 text-xs border rounded-lg">
                                <option value="Present">Present</option>
                                <option value="Absent">Absent</option>
                            </select>
                            <button id="btn-mark-att" onclick="window.markAttendance()" class="w-full bg-blue-600 text-white text-xs py-2.5 rounded-lg font-medium cursor-pointer hover:bg-blue-700 transition">Save Attendance to Cloud</button>
                        </div>

                        <!-- Add Event Section -->
                        <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
                            <h4 class="font-semibold text-xs text-slate-700 uppercase tracking-wider"><i class="fa-solid fa-calendar-plus mr-1 text-purple-600"></i> Add Upcoming Event</h4>
                            <input type="text" id="ev-name" placeholder="Event Name (e.g. Blood Donation Camp)" class="w-full px-3 py-2 text-xs border rounded-lg">
                            <input type="date" id="ev-date" class="w-full px-3 py-2 text-xs border rounded-lg">
                            <input type="text" id="ev-venue" placeholder="Venue (e.g. Main Auditorium)" class="w-full px-3 py-2 text-xs border rounded-lg">
                            <input type="text" id="ev-time" placeholder="Time (e.g. 10:00 AM)" class="w-full px-3 py-2 text-xs border rounded-lg">
                            <input type="url" id="ev-link" placeholder="Event / Registration Link (Optional)" class="w-full px-3 py-2 text-xs border rounded-lg">
                            <input type="url" id="ev-img" placeholder="Event Poster Image URL (Optional)" class="w-full px-3 py-2 text-xs border rounded-lg">
                            <button id="btn-add-ev" onclick="window.addEvent()" class="w-full bg-purple-600 text-white text-xs py-2.5 rounded-lg font-medium cursor-pointer hover:bg-purple-700 transition">Publish Event to Cloud</button>
                        </div>

                        <!-- Add Student Section -->
                        <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
                            <h4 class="font-semibold text-xs text-slate-700 uppercase tracking-wider"><i class="fa-solid fa-user-plus mr-1 text-emerald-600"></i> Add New Student to Firebase</h4>
                            <input type="text" id="new-name" placeholder="Student Full Name" class="w-full px-3 py-2 text-xs border rounded-lg">
                            <input type="text" id="new-pin" placeholder="PIN Number (e.g., 24CSE05)" class="w-full px-3 py-2 text-xs border rounded-lg uppercase">
                            <select id="new-branch" class="w-full px-3 py-2 text-xs border rounded-lg">
                                <option value="EEE">EEE</option><option value="CSE">CSE</option><option value="ECE">ECE</option>
                                <option value="Mechanical">Mechanical</option><option value="Civil">Civil</option><option value="Chemical">Chemical</option>
                            </select>
                            <button id="btn-add-stu" onclick="window.addStudent()" class="w-full bg-emerald-600 text-white text-xs py-2.5 rounded-lg font-medium cursor-pointer hover:bg-emerald-700 transition">Save Student to Database</button>
                        </div>

                        <!-- Post Announcement Section -->
                        <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
                            <h4 class="font-semibold text-xs text-slate-700 uppercase tracking-wider"><i class="fa-solid fa-bullhorn mr-1 text-indigo-600"></i> Post Live Announcement</h4>
                            <input type="text" id="msg-title" placeholder="Announcement Title" class="w-full px-3 py-2 text-xs border rounded-lg">
                            <textarea id="msg-content" placeholder="Message details..." class="w-full px-3 py-2 text-xs border rounded-lg"></textarea>
                            <button id="btn-post-msg" onclick="window.postMessage()" class="w-full bg-indigo-600 text-white text-xs py-2.5 rounded-lg font-medium cursor-pointer hover:bg-indigo-700 transition">Broadcast to Cloud</button>
                        </div>
                    </div>
                `;
            } else {
                let attendanceListHtml = '';
                const userAtt = currentUser.attendance || {};
                for (const [date, status] of Object.entries(userAtt)) {
                    attendanceListHtml += `
                        <div class="p-2.5 bg-slate-50 rounded-xl flex justify-between items-center text-xs">
                            <span class="font-medium text-slate-700"><i class="fa-solid fa-calendar mr-1 text-blue-500"></i> ${date}</span>
                            <span class="px-2 py-0.5 rounded text-[10px] font-semibold ${status === 'Present' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${status}</span>
                        </div>
                    `;
                }
                if (!attendanceListHtml) {
                    attendanceListHtml = `<p class="text-xs text-slate-400 text-center py-2">No attendance records logged yet.</p>`;
                }

                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="nss-gradient text-white p-5 rounded-2xl shadow-lg space-y-2">
                            <p class="text-xs text-blue-200">Welcome back,</p>
                            <h3 class="text-lg font-bold">${currentUser.name}</h3>
                            <div class="flex gap-2 pt-2">
                                <span class="bg-white/20 px-2.5 py-1 rounded-md text-[10px] font-medium">PIN: ${currentUser.pin}</span>
                                <span class="bg-white/20 px-2.5 py-1 rounded-md text-[10px] font-medium">Branch: ${currentUser.branch}</span>
                            </div>
                        </div>

                        <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
                            <h4 class="font-semibold text-xs text-slate-700 uppercase tracking-wider">My Attendance History</h4>
                            <div class="space-y-2 max-h-60 overflow-y-auto">
                                ${attendanceListHtml}
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        window.filterAttendanceStudents = function() {
            const branch = document.getElementById('att-branch-filter').value;
            const studentSelect = document.getElementById('att-student-pin');
            if (!studentSelect) return;

            if (!branch) {
                studentSelect.innerHTML = `<option value="">-- Select Branch Above First --</option>`;
                return;
            }

            const filteredStudents = students.filter(s => s.branch === branch);
            if (filteredStudents.length === 0) {
                studentSelect.innerHTML = `<option value="">No students found in ${branch}</option>`;
            } else {
                studentSelect.innerHTML = `<option value="">Select Student</option>` + 
                    filteredStudents.map(s => `<option value="${s.pin}">${s.name} (${s.pin})</option>`).join('');
            }
        };

        function renderEventsTab(container) {
            let html = `<div class="space-y-3"><h3 class="font-bold text-sm text-slate-700">Upcoming NSS Events</h3>`;
            if (events.length === 0) {
                html += `<p class="text-xs text-slate-400 text-center py-4">No upcoming events posted yet.</p>`;
            } else {
                events.forEach(e => {
                    html += `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-2">
                            ${e.imageUrl ? `<img src="${e.imageUrl}" class="w-full h-40 object-cover rounded-xl mb-2 border" alt="Event Poster">` : ''}
                            <div class="flex justify-between items-center">
                                <h4 class="font-bold text-xs text-blue-900">${e.name}</h4>
                                <span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-medium">${e.date}</span>
                            </div>
                            <p class="text-xs text-slate-500"><i class="fa-solid fa-location-dot mr-1"></i> ${e.venue} | <i class="fa-solid fa-clock ml-1"></i> ${e.time}</p>
                            ${e.link ? `<a href="${e.link}" target="_blank" class="inline-block mt-1 bg-blue-600 text-white text-[10px] px-3 py-1.5 rounded-lg font-medium hover:bg-blue-700 transition"><i class="fa-solid fa-external-link-alt mr-1"></i> Event / Registration Link</a>` : ''}
                        </div>
                    `;
                });
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderMessagesTab(container) {
            let html = `<div class="space-y-3"><h3 class="font-bold text-sm text-slate-700">Notice Board & Announcements</h3>`;
            if (messages.length === 0) {
                html += `<p class="text-xs text-slate-400 text-center py-4">No announcements posted yet.</p>`;
            } else {
                messages.forEach(m => {
                    html += `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-1">
                            <div class="flex justify-between items-center"><h4 class="font-bold text-xs text-slate-800">${m.title}</h4><span class="text-[10px] text-slate-400">${m.date}</span></div>
                            <p class="text-xs text-slate-600">${m.content}</p>
                        </div>
                    `;
                });
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderProfileTab(container) {
            container.innerHTML = `
                <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
                    <h3 class="font-bold text-sm text-slate-700">Firebase Student Directory</h3>
                    <div class="space-y-2 max-h-96 overflow-y-auto">
                        ${students.map(s => `
                            <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center text-xs">
                                <div>
                                    <p class="font-bold">${s.name}</p>
                                    <p class="text-[10px] text-slate-500">${s.pin} •${s.branch}</p>
                                </div>
                                <span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-[10px]">Active</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.addStudent = async function() {
            const btn = document.getElementById('btn-add-stu');
            const name = document.getElementById('new-name').value.trim();
            const pin = document.getElementById('new-pin').value.trim().toUpperCase();
            const branch = document.getElementById('new-branch').value;

            if (!name || !pin) {
                alert('Please enter both name and PIN');
                return;
            }

            if (btn) btn.disabled = true;
            try {
                await setDoc(doc(db, "students", pin), {
                    name: name,
                    pin: pin,
                    branch: branch,
                    attendance: {}
                });
                alert('Student successfully saved to Firebase!');
                document.getElementById('new-name').value = '';
                document.getElementById('new-pin').value = '';
            } catch (error) {
                console.error("Error adding student: ", error);
                alert('Failed to add student.');
            } finally {
                if (btn) btn.disabled = false;
            }
        };

        window.addEvent = async function() {
            const btn = document.getElementById('btn-add-ev');
            const name = document.getElementById('ev-name').value.trim();
            const date = document.getElementById('ev-date').value;
            const venue = document.getElementById('ev-venue').value.trim();
            const time = document.getElementById('ev-time').value.trim();
            const link = document.getElementById('ev-link').value.trim();
            const imageUrl = document.getElementById('ev-img').value.trim();

            if (!name || !date || !venue || !time) {
                alert('Please fill in Name, Date, Venue, and Time.');
                return;
            }

            if (btn) btn.disabled = true;
            try {
                await addDoc(collection(db, "events"), {
                    name,
                    date,
                    venue,
                    time,
                    link,
                    imageUrl
                });
                alert('Upcoming event published to Firebase successfully and sent to all students!');
                document.getElementById('ev-name').value = '';
                document.getElementById('ev-date').value = '';
                document.getElementById('ev-venue').value = '';
                document.getElementById('ev-time').value = '';
                document.getElementById('ev-link').value = '';
                document.getElementById('ev-img').value = '';
            } catch (error) {
                console.error("Error adding event: ", error);
                alert('Failed to publish event.');
            } finally {
                if (btn) btn.disabled = false;
            }
        };

        window.markAttendance = async function() {
            const btn = document.getElementById('btn-mark-att');
            const date = document.getElementById('att-date').value;
            const pin = document.getElementById('att-student-pin').value;
            const status = document.getElementById('att-status').value;

            if (!date || !pin) {
                alert('Please select a branch, student, and date.');
                return;
            }

            if (btn) btn.disabled = true;
            try {
                const studentRef = doc(db, "students", pin);
                const studentDoc = students.find(s => s.pin === pin);
                if (!studentDoc) {
                    alert('Student not found.');
                    return;
                }

                let updatedAttendance = studentDoc.attendance || {};
                updatedAttendance[date] = status;

                await updateDoc(studentRef, {
                    attendance: updatedAttendance
                });

                alert(`Attendance marked as ${status} for ${pin} on ${date}!`);
            } catch (error) {
                console.error("Error updating attendance: ", error);
                alert('Failed to update attendance.');
            } finally {
                if (btn) btn.disabled = false;
            }
        };

        window.postMessage = async function() {
            const btn = document.getElementById('btn-post-msg');
            const title = document.getElementById('msg-title').value.trim();
            const content = document.getElementById('msg-content').value.trim();
            if (!title || !content) {
                alert('Please fill in all announcement fields');
                return;
            }

            if (btn) btn.disabled = true;
            try {
                await addDoc(collection(db, "messages"), {
                    title: title,
                    content: content,
                    date: new Date().toISOString().split('T')[0]
                });
                alert('Announcement broadcasted to Firebase and sent to all students successfully!');
                document.getElementById('msg-title').value = '';
                document.getElementById('msg-content').value = '';
            } catch (error) {
                console.error("Error posting message: ", error);
                alert('Failed to post announcement.');
            } finally {
                if (btn) btn.disabled = false;
            }
        };

        window.onload = function() {
            if (currentUser) {
                showDashboard();
            }
        };
    </script>
</body>
</html>

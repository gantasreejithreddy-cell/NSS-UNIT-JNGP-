<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSS Unit JNGP | Official Community & Attendance System</title>
    <!-- PWA Manifest Meta Tags -->
    <meta name="theme-color" content="#050b14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NSS JNGP">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
      %22name%22: %22NSS Unit JNGP%22,
      %22short_name%22: %22NSS JNGP%22,
      %22start_url%22: %22.%22,
      %22display%22: %22standalone%22,
      %22background_color%22: %22%23050b14%22,
      %22theme_color%22: %22%23050b14%22,
      %22icons%22: [{
        %22src%22: %22https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=192%22,
        %22sizes%22: %22192x192%22,
        %22type%22: %22image/png%22
      }]
    }">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #050b14; color: #f8fafc; overflow-x: hidden; }
        .glass-box { background: rgba(15, 28, 51, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.3s ease; }
        .glass-box:hover { border-color: rgba(59, 130, 246, 0.3); transform: translateY(-2px); }
        .glass-box-active { background: rgba(30, 58, 138, 0.3); border: 1px solid rgba(59, 130, 246, 0.6); }
        @keyframes floatPulse {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-6px) scale(1.02); }
        }
        .welcome-anim { animation: floatPulse 3.5s ease-in-out infinite; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.4s ease forwards; }
    </style>
</head>
<body class="min-h-screen pb-24 relative">
    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col justify-between p-4 fade-in">
        
        <!-- Top Header -->
        <header class="flex justify-between items-center py-3 border-b border-slate-800/80 mb-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center shadow-md shadow-blue-500/20">
                    <i class="fa-solid fa-shield-halved text-white text-sm"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xs tracking-wide text-white">NSS UNIT JNGP</h1>
                    <p class="text-[10px] text-slate-400" id="header-subtitle">Govt Polytechnic Ramanthapur</p>
                </div>
            </div>
            <div id="header-action"></div>
        </header>

        <!-- Main View Area -->
        <main id="main-container" class="flex-1 space-y-4 pb-16"></main>

        <!-- Bottom Navigation Bar -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#071120]/95 backdrop-blur-md border-t border-slate-800/80 flex justify-around py-3 px-2 z-30 shadow-2xl">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-blue-500 text-xs font-semibold cursor-pointer transition hover:text-blue-400">
                <i class="fa-solid fa-house text-lg mb-0.5"></i> Home
            </button>
            <button onclick="switchTab('events')" id="nav-events" class="flex flex-col items-center text-slate-500 text-xs font-medium cursor-pointer transition hover:text-slate-300">
                <i class="fa-solid fa-calendar-days text-lg mb-0.5"></i> Events & Gallery
            </button>
            <button onclick="switchTab('messages')" id="nav-messages" class="flex flex-col items-center text-slate-500 text-xs font-medium cursor-pointer transition hover:text-slate-300">
                <i class="fa-solid fa-bullhorn text-lg mb-0.5"></i> Notice Board
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-slate-500 text-xs font-medium cursor-pointer transition hover:text-slate-300">
                <i class="fa-solid fa-id-card text-lg mb-0.5"></i> Profile & ID
            </button>
        </nav>
    </div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, addDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgYi6crYP7Em-z32TeIjHpUPfLGMNWFDY",
            authDomain: "nss-unit-jngp.firebaseapp.com",
            projectId: "nss-unit-jngp",
            storageBucket: "nss-unit-jngp.firebasestorage.app",
            messagingSenderId: "827655385529",
            appId: "1:827655385529:web:6df3292b78aef040a68668",
            measurementId: "G-294DT88D4R"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = JSON.parse(localStorage.getItem('nss_current_user')) || null;
        let students = [];
        let messages = [];
        let events = [];
        let gallery = [];
        let suggestions = [];
        let currentTab = 'home';
        let currentSubView = null; 
        let selectedBranch = 'CIVIL';
        const authorizedDevelopers = ["DEV-001", "DEV-002", "DEV-003"];

        function initSync() {
            onSnapshot(collection(db, "students"), snap => {
                students = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
            });
            onSnapshot(collection(db, "messages"), snap => {
                messages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
            });
            onSnapshot(collection(db, "events"), snap => {
                events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
            });
            onSnapshot(collection(db, "gallery"), snap => {
                gallery = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
            });
            onSnapshot(collection(db, "suggestions"), snap => {
                suggestions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
            });
        }

        initSync();

        window.switchTab = function(tab) {
            currentTab = tab;
            currentSubView = null;
            ['home', 'events', 'messages', 'profile'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if(btn) btn.className = t === tab ? 'flex flex-col items-center text-blue-500 text-xs font-semibold cursor-pointer transition' : 'flex flex-col items-center text-slate-500 text-xs font-medium cursor-pointer transition hover:text-slate-300';
            });
            renderUI();
        };

        window.openSubView = function(view) {
            currentSubView = view;
            renderUI();
        };

        window.closeSubView = function() {
            currentSubView = null;
            renderUI();
        };

        function renderUI() {
            const headerAction = document.getElementById('header-action');
            const subTitle = document.getElementById('header-subtitle');
            const container = document.getElementById('main-container');

            if (currentUser) {
                if (currentUser.role === 'developer') subTitle.innerText = `Developer Admin (${currentUser.pin})`;
                else if (currentUser.role === 'board') subTitle.innerText = `${currentUser.designation || 'Board Executive'} (${currentUser.pin})`;
                else subTitle.innerText = `${currentUser.branch} Student (${currentUser.pin})`;
                headerAction.innerHTML = `<button onclick="logout()" class="bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 text-xs px-3 py-1.5 rounded-xl border border-rose-500/30 transition cursor-pointer flex items-center gap-1.5 shadow-sm"><i class="fa-solid fa-arrow-right-from-bracket"></i> Exit</button>`;
            } else {
                subTitle.innerText = 'Govt Polytechnic Ramanthapur';
                headerAction.innerHTML = '';
            }

            if (currentSubView) {
                renderSubViewContent(container);
                return;
            }

            if (currentTab === 'home') renderHome(container);
            else if (currentTab === 'events') renderEvents(container);
            else if (currentTab === 'messages') renderMessages(container);
            else if (currentTab === 'profile') renderProfile(container);
        }

        function renderHome(container) {
            if (!currentUser) {
                container.innerHTML = `
                    <div class="glass-box p-6 rounded-3xl space-y-6 shadow-2xl text-center fade-in">
                        <div class="flex justify-center pt-2">
                            <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-xl shadow-blue-500/20 welcome-anim">
                                <i class="fa-solid fa-hands-holding-child text-3xl text-white"></i>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <span class="text-[10px] bg-blue-500/20 text-blue-300 px-4 py-1.5 rounded-full font-semibold tracking-wider uppercase border border-blue-400/30">"NOT ME, BUT YOU"</span>
                            <h2 class="text-2xl font-bold tracking-wide text-white pt-1">NSS UNIT JNGP</h2>
                            <p class="text-xs text-slate-400">Govt Polytechnic College, Ramanthapur</p>
                        </div>
                        <p class="text-xs text-slate-300 leading-relaxed px-2">
                            Autonomous volunteer management system logging 240 service hours, departmental attendance tracking, and official certifications.
                        </p>
                        <div class="space-y-3 pt-2">
                            <button onclick="openBoardLoginModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 px-6 rounded-2xl shadow-lg transition flex items-center justify-between cursor-pointer border border-blue-400/30">
                                <div class="flex items-center gap-3"><i class="fa-solid fa-shield-halved text-lg"></i> <span class="text-sm">Board Member Portal</span></div>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                            <button onclick="openStudentLoginModal()" class="w-full glass-box hover:bg-slate-800/80 text-white font-semibold py-3.5 px-6 rounded-2xl shadow-lg transition flex items-center justify-between cursor-pointer border border-slate-700">
                                <div class="flex items-center gap-3"><i class="fa-solid fa-graduation-cap text-lg text-purple-400"></i> <span class="text-sm">Student Sign In</span></div>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                `;
            } else if (currentUser.role === 'board') {
                container.innerHTML = `
                    <div class="glass-box p-5 rounded-3xl space-y-1 fade-in">
                        <p class="text-xs text-slate-400">Board Executive Member</p>
                        <h2 class="text-xl font-bold text-white">${currentUser.name}</h2>
                        <p class="text-xs text-slate-400 pt-0.5">PIN: ${currentUser.pin} • ${currentUser.designation}</p>
                    </div>

                    <div class="grid grid-cols-2 gap-3 fade-in">
                        <div onclick="openSubView('session-attendance')" class="glass-box p-4 rounded-2xl hover:border-blue-500/50 transition cursor-pointer space-y-2">
                            <div class="w-10 h-10 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center"><i class="fa-solid fa-clock text-lg"></i></div>
                            <h3 class="font-bold text-sm text-white">Session Attendance</h3>
                            <p class="text-[10px] text-slate-400">Weekly drills & classes</p>
                        </div>
                        <div onclick="openSubView('event-attendance')" class="glass-box p-4 rounded-2xl hover:border-purple-500/50 transition cursor-pointer space-y-2">
                            <div class="w-10 h-10 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center"><i class="fa-solid fa-calendar-check text-lg"></i></div>
                            <h3 class="font-bold text-sm text-white">Event Attendance</h3>
                            <p class="text-[10px] text-slate-400">Special camps & rallies</p>
                        </div>
                        <div onclick="openSubView('register-student')" class="glass-box p-4 rounded-2xl hover:border-emerald-500/50 transition cursor-pointer space-y-2">
                            <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center"><i class="fa-solid fa-user-plus text-lg"></i></div>
                            <h3 class="font-bold text-sm text-white">Register Student</h3>
                            <p class="text-[10px] text-slate-400">Enroll volunteers manually</p>
                        </div>
                        <div onclick="openSubView('broadcast-notice')" class="glass-box p-4 rounded-2xl hover:border-amber-500/50 transition cursor-pointer space-y-2">
                            <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center"><i class="fa-solid fa-bullhorn text-lg"></i></div>
                            <h3 class="font-bold text-sm text-white">Broadcast Notice</h3>
                            <p class="text-[10px] text-slate-400">Push live announcements</p>
                        </div>
                    </div>

                    <div class="glass-box p-5 rounded-3xl space-y-3 fade-in">
                        <h3 class="font-bold text-sm text-white flex items-center gap-2"><i class="fa-solid fa-table text-emerald-400"></i> Attendance Reports & Table Downloads</h3>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="window.downloadReport('session')" class="glass-box p-2.5 rounded-xl text-[10px] font-semibold text-blue-300 hover:bg-blue-600/20 transition cursor-pointer">Session Table</button>
                            <button onclick="window.downloadReport('event')" class="glass-box p-2.5 rounded-xl text-[10px] font-semibold text-purple-300 hover:bg-purple-600/20 transition cursor-pointer">Event Table</button>
                            <button onclick="window.downloadReport('combined')" class="glass-box p-2.5 rounded-xl text-[10px] font-semibold text-emerald-300 hover:bg-emerald-600/20 transition cursor-pointer">Combined Table</button>
                        </div>
                    </div>
                `;
            } else {
                let userAtt = currentUser.attendance || {};
                let userEvents = currentUser.eventsAttended || [];
                let sessionCount = Object.values(userAtt).filter(v => v === 'Present').length;
                let sessionHours = sessionCount * 3;
                let eventHours = userEvents.reduce((acc, ev) => acc + (ev.hours || 3), 0);
                let combinedTotalHours = sessionHours + eventHours;
                let combinedPct = Math.round((combinedTotalHours / 240) * 100);
                let isEligible = combinedTotalHours >= 240;

                container.innerHTML = `
                    <div class="glass-box p-5 rounded-3xl space-y-2 fade-in">
                        <p class="text-xs text-purple-300">Student Volunteer Dashboard</p>
                        <h2 class="text-xl font-bold text-white">${currentUser.name}</h2>
                        <p class="text-xs text-slate-400">PIN: ${currentUser.pin} • Branch: ${currentUser.branch}</p>
                    </div>

                    <div class="glass-box p-4 rounded-2xl flex items-center justify-between border ${isEligible ? 'border-emerald-500 bg-emerald-950/30' : 'border-amber-500/40 bg-amber-950/20'} fade-in">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl ${isEligible ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'} flex items-center justify-center text-lg">
                                <i class="fa-solid fa-award"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-xs ${isEligible ? 'text-emerald-300' : 'text-amber-300'}">${isEligible ? 'Certificate Eligible! 🎉' : 'In Progress (Target: 240 Hrs)'}</h4>
                                <p class="text-[10px] text-slate-400">${isEligible ? 'Completed 240-hour requirement!' : `${240 - combinedTotalHours} hours remaining.`}</p>
                            </div>
                        </div>
                    </div>

                    <div class="glass-box p-5 rounded-3xl space-y-4 border border-blue-500/30 fade-in">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-xs text-slate-300 uppercase tracking-wider"><i class="fa-solid fa-hourglass-half text-blue-400 mr-1"></i> 240-Hour Goal</h3>
                            <span class="text-xs font-bold text-blue-400">${combinedTotalHours} / 240 Hrs</span>
                        </div>
                        <div class="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-800">
                            <div class="bg-gradient-to-r from-blue-500 to-indigo-500 h-full rounded-full transition-all duration-700" style="width: ${Math.min(100, combinedPct)}%"></div>
                        </div>
                    </div>

                    <button onclick="openIdCardModal()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg transition flex items-center justify-center gap-2 cursor-pointer border border-blue-400/30 fade-in">
                        <i class="fa-solid fa-id-badge text-lg"></i> <span>View Digital ID Card</span>
                    </button>
                `;
            }
        }

        window.openIdCardModal = function() {
            if (!currentUser) return;
            let userAtt = currentUser.attendance || {};
            let sessionHours = Object.values(userAtt).filter(v => v === 'Present').length * 3;
            let eventHours = (currentUser.eventsAttended || []).reduce((acc, ev) => acc + (ev.hours || 3), 0);
            let total = sessionHours + eventHours;

            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 fade-in">
                    <div class="glass-box w-full max-w-sm rounded-3xl p-6 space-y-4 relative border border-blue-500/40 shadow-2xl text-center">
                        <button onclick="window.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
                        <div class="flex items-center justify-center gap-2 pb-1 border-b border-slate-800">
                            <i class="fa-solid fa-shield-halved text-blue-400 text-lg"></i>
                            <h3 class="font-bold text-xs tracking-wider text-white">NSS UNIT JNGP ID CARD</h3>
                        </div>
                        <div class="w-20 h-20 mx-auto rounded-2xl bg-blue-600/20 border border-blue-500/40 flex items-center justify-center text-blue-400 text-2xl font-bold">
                            ${currentUser.name.charAt(0)}
                        </div>
                        <div class="space-y-1">
                            <h4 class="font-bold text-sm text-white">${currentUser.name}</h4>
                            <p class="text-xs text-blue-400 font-mono font-semibold">${currentUser.pin}</p>
                            <p class="text-[11px] text-slate-400">${currentUser.branch} Department • ${currentUser.year || '2nd Year'}</p>
                        </div>
                        <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-800 flex justify-around text-center">
                            <div><p class="text-[9px] text-slate-400">Total Hours</p><p class="text-sm font-bold text-emerald-400">${total} Hrs</p></div>
                            <div><p class="text-[9px] text-slate-400">Status</p><p class="text-sm font-bold text-blue-400">Active</p></div>
                        </div>
                    </div>
                </div>
            `;
        };

        function renderSubViewContent(container) {
            if (currentSubView === 'session-attendance') {
                container.innerHTML = `
                    <div class="glass-box p-5 rounded-3xl space-y-4 fade-in">
                        <div class="flex items-center gap-3">
                            <button onclick="closeSubView()" class="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center text-slate-300 hover:text-white cursor-pointer"><i class="fa-solid fa-arrow-left"></i></button>
                            <div><h3 class="font-bold text-sm text-white">Session Attendance</h3><p class="text-[10px] text-slate-400">Mark Present/Absent simultaneously</p></div>
                        </div>
                        <div class="space-y-3">
                            <label class="text-[10px] text-slate-400 font-semibold block">DATE</label>
                            <input type="date" id="sess-date" value="${new Date().toISOString().split('T')[0]}" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                            <label class="text-[10px] text-slate-400 font-semibold block">SELECT BRANCH:</label>
                            <div class="grid grid-cols-4 gap-2">
                                ${['CIVIL', 'MECH', 'EEE', 'ECE', 'CHEM', 'MET', 'PKG', 'AME'].map(b => `
                                    <button onclick="window.selectAttendanceBranch('${b}')" id="btn-branch-${b}" class="branch-btn glass-box py-2 rounded-xl text-xs font-semibold ${selectedBranch === b ? 'border-blue-500 bg-blue-600/20 text-white' : 'text-slate-300'} transition cursor-pointer">${b}</button>
                                `).join('')}
                            </div>
                            <div id="branch-roster-area" class="pt-2"></div>
                        </div>
                    </div>
                `;
                window.selectAttendanceBranch(selectedBranch);
            } else if (currentSubView === 'register-student') {
                container.innerHTML = `
                    <div class="glass-box p-5 rounded-3xl space-y-4 fade-in">
                        <div class="flex items-center gap-3">
                            <button onclick="closeSubView()" class="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center text-slate-300 hover:text-white cursor-pointer"><i class="fa-solid fa-arrow-left"></i></button>
                            <div><h3 class="font-bold text-sm text-white">Student Registration</h3><p class="text-[10px] text-slate-400">Manual onboarding</p></div>
                        </div>
                        <div class="space-y-3">
                            <input type="text" id="reg-name" placeholder="Full Name" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                            <input type="text" id="reg-pin" placeholder="PIN Number" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white uppercase">
                            <select id="reg-branch" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                                ${['CIVIL', 'MECH', 'EEE', 'ECE', 'CHEM', 'MET', 'PKG', 'AME'].map(b => `<option value="${b}">${b}</option>`).join('')}
                            </select>
                            <button onclick="window.registerStudentAction()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 rounded-2xl shadow-lg transition cursor-pointer">Save Student</button>
                        </div>
                    </div>
                `;
            } else if (currentSubView === 'broadcast-notice') {
                container.innerHTML = `
                    <div class="glass-box p-5 rounded-3xl space-y-4 fade-in">
                        <div class="flex items-center gap-3">
                            <button onclick="closeSubView()" class="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center text-slate-300 hover:text-white cursor-pointer"><i class="fa-solid fa-arrow-left"></i></button>
                            <div><h3 class="font-bold text-sm text-white">Broadcast Notice</h3><p class="text-[10px] text-slate-400">Push live announcements</p></div>
                        </div>
                        <div class="space-y-3">
                            <input type="text" id="notice-title" placeholder="Notice Title" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                            <textarea id="notice-content" rows="4" placeholder="Announcement content..." class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white"></textarea>
                            <button onclick="window.broadcastNoticeAction()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-2xl shadow-lg transition cursor-pointer">Publish Broadcast</button>
                        </div>
                    </div>
                `;
            }
        }

        window.selectAttendanceBranch = function(b) {
            selectedBranch = b;
            document.querySelectorAll('.branch-btn').forEach(btn => btn.classList.remove('border-blue-500', 'bg-blue-600/20'));
            const el = document.getElementById(`btn-branch-${b}`);
            if(el) el.classList.add('border-blue-500', 'bg-blue-600/20');
            const rosterArea = document.getElementById('branch-roster-area');
            const filtered = students.filter(s => s.branch === selectedBranch);
            if (filtered.length === 0) { rosterArea.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No students found.</p>`; return; }
            rosterArea.innerHTML = `
                <div class="space-y-2 max-h-56 overflow-y-auto">
                    ${filtered.map(s => `
                        <div class="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 text-xs">
                            <div><p class="font-bold text-white">${s.name}</p><p class="text-[10px] text-slate-400">${s.pin}</p></div>
                            <select id="status-${s.pin}" class="px-3 py-1 bg-slate-800 border border-slate-700 rounded-lg text-xs font-semibold text-emerald-400">
                                <option value="Present" selected>Present</option>
                                <option value="Absent">Absent</option>
                            </select>
                        </div>
                    `).join('')}
                    <button onclick="window.submitAttendanceBatch()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl text-xs mt-3 cursor-pointer">Submit Attendance Batch</button>
                </div>
            `;
        };

        window.submitAttendanceBatch = async function() {
            const date = document.getElementById('sess-date').value;
            const filtered = students.filter(s => s.branch === selectedBranch);
            try {
                for(let s of filtered) {
                    const sel = document.getElementById(`status-${s.pin}`);
                    let att = s.attendance || {};
                    att[date] = sel ? sel.value : 'Present';
                    await updateDoc(doc(db, "students", s.pin), { attendance: att });
                }
                alert('Attendance successfully recorded!');
                closeSubView();
            } catch(e) { alert('Failed.'); }
        };

        window.registerStudentAction = async function() {
            const name = document.getElementById('reg-name').value.trim();
            const pin = document.getElementById('reg-pin').value.trim().toUpperCase();
            const branch = document.getElementById('reg-branch').value;
            if(!name || !pin) return alert('Enter name and PIN.');
            try {
                await setDoc(doc(db, "students", pin), { name, pin, branch, year: '2nd Year', attendance: {}, eventsAttended: [] });
                alert('Student registered!');
                closeSubView();
            } catch(e) { alert('Failed.'); }
        };

        window.broadcastNoticeAction = async function() {
            const title = document.getElementById('notice-title').value.trim();
            const content = document.getElementById('notice-content').value.trim();
            if(!title || !content) return alert('Fill fields.');
            try {
                const sender = currentUser ? `${currentUser.name} (${currentUser.designation || 'Board Member'})` : 'Board';
                await addDoc(collection(db, "messages"), { title, content, sender, date: new Date().toISOString().split('T')[0] });
                alert('Notice broadcasted!');
                closeSubView();
            } catch(e) { alert('Failed.'); }
        };

        function renderEvents(container) {
            container.innerHTML = `
                <div class="glass-box p-5 rounded-3xl space-y-4 fade-in">
                    <h2 class="text-base font-bold text-white"><i class="fa-solid fa-calendar-days text-purple-400 mr-2"></i> Upcoming Events</h2>
                    <div class="space-y-3">
                        ${events.length === 0 ? '<p class="text-xs text-slate-500 text-center py-4">No events.</p>' : events.map(e => `
                            <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 space-y-2">
                                <div class="flex justify-between items-center"><h3 class="font-bold text-xs text-white">${e.name}</h3><span class="text-[10px] bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded">${e.date}</span></div>
                                <p class="text-xs text-slate-400"><i class="fa-solid fa-location-dot mr-1"></i> ${e.venue}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="glass-box p-5 rounded-3xl space-y-3 mt-4 fade-in">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-sm text-white flex items-center gap-2"><i class="fa-solid fa-images text-amber-400"></i> Event Proof Gallery</h3>
                        ${currentUser && currentUser.role === 'board' ? `<button onclick="window.uploadGalleryPhotoPrompt()" class="bg-amber-600/30 text-amber-300 text-[10px] px-2.5 py-1 rounded-lg">Upload Photo</button>` : ''}
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        ${gallery.length === 0 ? '<p class="text-xs text-slate-500 text-center col-span-2 py-3">No activity snapshots.</p>' : gallery.map(g => `
                            <div class="glass-box p-2 rounded-xl space-y-1">
                                <img src="${g.url}" class="w-full h-28 object-cover rounded-lg">
                                <p class="text-[10px] font-semibold text-white truncate">${g.title}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.uploadGalleryPhotoPrompt = async function() {
            const title = prompt("Enter activity title:");
            const url = prompt("Enter image URL:");
            if(title && url) {
                await addDoc(collection(db, "gallery"), { title, url });
                alert('Photo uploaded!');
            }
        };

        function renderMessages(container) {
            container.innerHTML = `
                <div class="glass-box p-5 rounded-3xl space-y-4 fade-in">
                    <div class="flex justify-between items-center">
                        <h2 class="text-base font-bold text-white"><i class="fa-solid fa-bullhorn text-amber-400 mr-2"></i> Notice Board</h2>
                        ${currentUser && currentUser.role === 'student' ? `<button onclick="window.openSuggestionModal()" class="bg-purple-600/30 text-purple-300 text-[10px] px-2.5 py-1 rounded-lg">Suggestion Box</button>` : ''}
                    </div>
                    <div class="space-y-3">
                        ${messages.length === 0 ? '<p class="text-xs text-slate-500 text-center py-4">No notices.</p>' : messages.map(m => `
                            <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 space-y-2">
                                <div class="flex justify-between items-center"><h3 class="font-bold text-xs text-white">${m.title}</h3><span class="text-[10px] text-slate-500">${m.date}</span></div>
                                <p class="text-xs text-slate-300">${m.content}</p>
                                <div class="pt-2 border-t border-slate-800 flex justify-between items-center text-[10px]">
                                    <span class="text-blue-400"><i class="fa-solid fa-user-shield mr-1"></i> ${m.sender || 'Board'}</span>
                                    <a href="https://api.whatsapp.com/send?text=${encodeURIComponent('NSS Notice: ' + m.title + ' - ' + m.content)}" target="_blank" class="bg-emerald-600/20 text-emerald-400 px-2.5 py-1 rounded-lg font-semibold flex items-center gap-1"><i class="fa-brands fa-whatsapp"></i> Share</a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.openSuggestionModal = function() {
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 fade-in">
                    <div class="glass-box w-full max-w-sm rounded-3xl p-6 space-y-3 relative border border-purple-500/40 shadow-2xl">
                        <button onclick="window.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
                        <h3 class="text-base font-bold text-white">Student Suggestion Box</h3>
                        <input type="text" id="sug-title" placeholder="Suggestion Title" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                        <textarea id="sug-content" rows="3" placeholder="Describe your idea..." class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white"></textarea>
                        <button onclick="window.submitSuggestionAction()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 rounded-xl text-xs cursor-pointer">Submit</button>
                    </div>
                </div>
            `;
        };

        window.submitSuggestionAction = async function() {
            const title = document.getElementById('sug-title').value.trim();
            const content = document.getElementById('sug-content').value.trim();
            if(!title || !content) return alert('Fill fields.');
            await addDoc(collection(db, "suggestions"), { title, content, studentName: currentUser.name });
            alert('Suggestion submitted!'); closeModal();
        };

        function renderProfile(container) {
            if(!currentUser) return container.innerHTML = `<div class="glass-box p-6 rounded-3xl text-center"><p class="text-xs text-slate-400">Please sign in.</p></div>`;
            container.innerHTML = `
                <div class="glass-box p-5 rounded-3xl space-y-4 fade-in">
                    <h2 class="text-base font-bold text-white"><i class="fa-solid fa-id-card text-blue-400 mr-2"></i> User Identity & Profile</h2>
                    <div class="space-y-3">
                        <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800"><p class="text-[10px] text-slate-400 font-semibold">ROLE</p><p class="text-sm font-bold text-white mt-0.5">${currentUser.role === 'developer' ? 'System Developer' : (currentUser.role === 'board' ? currentUser.designation || 'Board Executive' : 'Student Volunteer')}</p></div>
                        <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800"><p class="text-[10px] text-slate-400 font-semibold">FULL NAME & PIN</p><p class="text-sm font-bold text-white mt-0.5">${currentUser.name} (${currentUser.pin})</p></div>
                        ${currentUser.role === 'student' ? `<button onclick="openIdCardModal()" class="w-full bg-blue-600/30 text-blue-300 py-2.5 rounded-xl text-xs font-semibold cursor-pointer border border-blue-500/30">View Digital ID Card</button>` : ''}
                    </div>
                </div>
            `;
        }

        window.openBoardLoginModal = function() {
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 fade-in">
                    <div class="glass-box w-full max-w-sm rounded-3xl p-6 space-y-4 relative border border-slate-700 shadow-2xl">
                        <button onclick="window.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
                        <h3 class="text-base font-bold text-white">Board Executive Access</h3>
                        <input type="password" id="login-passcode" placeholder="Enter Secret Passcode" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                        <input type="text" id="login-name" placeholder="Board Member Full Name" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                        <input type="text" id="login-pin" placeholder="Board Member PIN" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                        <input type="text" id="login-desig" placeholder="Official Designation" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                        <button onclick="window.verifyBoardLogin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 rounded-2xl shadow-lg transition cursor-pointer">Verify & Continue</button>
                    </div>
                </div>
            `;
        };

        window.openStudentLoginModal = function() {
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 fade-in">
                    <div class="glass-box w-full max-w-sm rounded-3xl p-6 space-y-4 relative border border-slate-700 shadow-2xl">
                        <button onclick="window.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
                        <h3 class="text-base font-bold text-white">Student Sign In</h3>
                        <input type="text" id="student-login-pin" placeholder="Enter Student PIN" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white uppercase">
                        <button onclick="window.verifyStudentLogin()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3.5 rounded-2xl shadow-lg transition cursor-pointer">Login</button>
                    </div>
                </div>
            `;
        };

        window.openDeveloperLoginModal = function() {
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 fade-in">
                    <div class="glass-box w-full max-w-sm rounded-3xl p-6 space-y-4 relative border border-emerald-500/40 shadow-2xl">
                        <button onclick="window.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
                        <h3 class="text-base font-bold text-white">Developer Login</h3>
                        <input type="text" id="dev-pin" placeholder="Developer PIN (DEV-001)" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white uppercase">
                        <input type="password" id="dev-pass" placeholder="Enter Secret Key" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                        <button onclick="window.verifyDeveloperLogin()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 rounded-2xl shadow-lg transition cursor-pointer">Access</button>
                    </div>
                </div>
            `;
        };

        window.verifyBoardLogin = function() {
            const pass = document.getElementById('login-passcode').value;
            const name = document.getElementById('login-name').value.trim();
            const pin = document.getElementById('login-pin').value.trim();
            const desig = document.getElementById('login-desig').value.trim();
            // Secret PIN changed to 1029
            if (pass === '1029' && name && pin) {
                currentUser = { role: 'board', name: name, pin: pin, designation: desig || 'Board Executive' };
                localStorage.setItem('nss_current_user', JSON.stringify(currentUser));
                closeModal(); renderUI();
            } else alert('Please fill in valid passcode, name, and PIN!');
        };

        window.verifyStudentLogin = async function() {
            const pin = document.getElementById('student-login-pin').value.trim().toUpperCase();
            const snap = await getDoc(doc(db, "students", pin));
            if(snap.exists()) {
                currentUser = { role: 'student', ...snap.data() };
                localStorage.setItem('nss_current_user', JSON.stringify(currentUser));
                closeModal(); renderUI();
            } else alert('Student PIN not found.');
        };

        window.verifyDeveloperLogin = function() {
            const pin = document.getElementById('dev-pin').value.trim().toUpperCase();
            const pass = document.getElementById('dev-pass').value;
            // Secret PIN changed to 1029
            if(authorizedDevelopers.includes(pin) && pass === '1029') {
                currentUser = { role: 'developer', name: 'Lead System Developer', pin: pin };
                localStorage.setItem('nss_current_user', JSON.stringify(currentUser));
                closeModal(); renderUI();
            } else alert('Unauthorized.');
        };

        window.closeModal = function() { document.getElementById('modal-container').innerHTML = ''; };
        window.logout = function() { currentUser = null; localStorage.removeItem('nss_current_user'); renderUI(); };
        
        window.downloadReport = function(type) {
            let csv = "PIN | Student Name | Branch | Total Hours\n";
            csv += "----------------------------------------\n";
            students.forEach(s => {
                let h = (s.attendance ? Object.values(s.attendance).filter(v => v === 'Present').length * 3 : 0) + (s.eventsAttended ? s.eventsAttended.reduce((a,b)=>a+(b.hours||3),0) : 0);
                csv += `${s.pin} | ${s.name} | ${s.branch} | ${h} Hrs\n`;
            });
            const link = document.createElement("a");
            link.href = encodeURI("data:text/csv;charset=utf-8," + csv);
            link.download = `NSS_${type}_attendance_table_report.csv`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };
    </script>
</body>
</html>

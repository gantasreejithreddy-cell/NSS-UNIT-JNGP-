<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSS Unit JNGP | Official Community & Attendance System</title>
    <!-- PWA Manifest Meta Tags -->
    <meta name="theme-color" content="#050b14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NSS JNGP">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
      %22name%22: %22NSS Unit JNGP%22,
      %22short_name%22: %22NSS JNGP%22,
      %22start_url%22: %22.%22,
      %22display%22: %22standalone%22,
      %22background_color%22: %22%23050b14%22,
      %22theme_color%22: %22%23050b14%22,
      %22icons%22: [{
        %22src%22: %22https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=192%22,
        %22sizes%22: %22192x192%22,
        %22type%22: %22image/png%22
      }]
    }">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #050b14; color: #f8fafc; }
        .glass-box { background: rgba(15, 28, 51, 0.75); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-box-active { background: rgba(30, 58, 138, 0.25); border: 1px solid rgba(59, 130, 246, 0.5); }
        @keyframes floatPulse {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); }
        }
        .welcome-anim { animation: floatPulse 3s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen pb-24 relative">
    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col justify-between p-4">
        
        <!-- Top Header -->
        <header class="flex justify-between items-center py-3 border-b border-slate-800/80 mb-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center overflow-hidden">
                    <i class="fa-solid fa-shield-halved text-blue-400"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xs tracking-wide text-white">NSS UNIT JNGP</h1>
                    <p class="text-[10px] text-slate-400" id="header-subtitle">Govt Polytechnic Ramanthapur</p>
                </div>
            </div>
            <div id="header-action"></div>
        </header>

        <!-- Main View Area -->
        <main id="main-container" class="flex-1 space-y-4 pb-16"></main>

        <!-- Bottom Navigation Bar -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#071120] border-t border-slate-800/80 flex justify-around py-3 px-2 z-30 shadow-2xl">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-blue-500 text-xs font-semibold cursor-pointer">
                <i class="fa-solid fa-house text-lg"></i> Home
            </button>
            <button onclick="switchTab('events')" id="nav-events" class="flex flex-col items-center text-slate-500 text-xs font-medium cursor-pointer">
                <i class="fa-solid fa-calendar-days text-lg"></i> Events
            </button>
            <button onclick="switchTab('messages')" id="nav-messages" class="flex flex-col items-center text-slate-500 text-xs font-medium cursor-pointer">
                <i class="fa-solid fa-bullhorn text-lg"></i> Notice Board
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-slate-500 text-xs font-medium cursor-pointer">
                <i class="fa-solid fa-id-card text-lg"></i> Profile
            </button>
        </nav>
    </div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, addDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgYi6crYP7Em-z32TeIjHpUPfLGMNWFDY",
            authDomain: "nss-unit-jngp.firebaseapp.com",
            projectId: "nss-unit-jngp",
            storageBucket: "nss-unit-jngp.firebasestorage.app",
            messagingSenderId: "827655385529",
            appId: "1:827655385529:web:6df3292b78aef040a68668",
            measurementId: "G-294DT88D4R"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = JSON.parse(localStorage.getItem('nss_current_user')) || null;
        let students = [];
        let messages = [];
        let events = [];
        let editRequests = [];
        let auditLogs = [];
        let currentTab = 'home';
        let currentSubView = null; 
        let selectedBranch = 'CIVIL';
        let selectedYear = '2nd Year';

        // Authorized Developers List (Requirement 13 & 14)
        const authorizedDevelopers = ["DEV-001", "DEV-002", "DEV-003"];

        function initSync() {
            onSnapshot(collection(db, "students"), snap => {
                students = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
            });
            onSnapshot(collection(db, "messages"), snap => {
                messages = snap.docs.map(d => d.data());
                renderUI();
            });
            onSnapshot(collection(db, "events"), snap => {
                events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
            });
            onSnapshot(collection(db, "edit_requests"), snap => {
                editRequests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
            });
            onSnapshot(collection(db, "audit_logs"), snap => {
                auditLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
            });
        }

        initSync();

        window.switchTab = function(tab) {
            currentTab = tab;
            currentSubView = null;
            ['home', 'events', 'messages', 'profile'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if(btn) btn.className = t === tab ? 'flex flex-col items-center text-blue-500 text-xs font-semibold cursor-pointer' : 'flex flex-col items-center text-slate-500 text-xs font-medium cursor-pointer';
            });
            renderUI();
        };

        window.openSubView = function(view) {
            currentSubView = view;
            renderUI();
        };

        window.closeSubView = function() {
            currentSubView = null;
            renderUI();
        };

        function renderUI() {
            const headerAction = document.getElementById('header-action');
            const subTitle = document.getElementById('header-subtitle');
            const container = document.getElementById('main-container');

            if (currentUser) {
                if (currentUser.role === 'developer') {
                    subTitle.innerText = `Developer Admin (${currentUser.pin})`;
                } else if (currentUser.role === 'board') {
                    subTitle.innerText = `${currentUser.designation || 'Technical and financial head'} (${currentUser.pin})`;
                } else {
                    subTitle.innerText = `${currentUser.branch} Student (${currentUser.pin})`;
                }
                headerAction.innerHTML = `<button onclick="logout()" class="bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 text-xs px-3 py-1.5 rounded-xl border border-rose-500/30 transition cursor-pointer flex items-center gap-1.5"><i class="fa-solid fa-arrow-right-from-bracket"></i> Exit</button>`;
            } else {
                subTitle.innerText = 'Govt Polytechnic Ramanthapur';
                headerAction.innerHTML = '';
            }

            if (currentSubView) {
                renderSubViewContent(container);
                return;
            }

            if (currentTab === 'home') renderHome(container);
            else if (currentTab === 'events') renderEvents(container);
            else if (currentTab === 'messages') renderMessages(container);
            else if (currentTab === 'profile') renderProfile(container);
        }

        function renderHome(container) {
            if (!currentUser) {
                // Landing Screen
                container.innerHTML = `
                    <div class="glass-box p-6 rounded-3xl space-y-5 shadow-2xl text-center">
                        <div class="flex justify-center pt-2">
                            <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-xl shadow-blue-500/20 welcome-anim">
                                <i class="fa-solid fa-hands-holding-child text-3xl text-white"></i>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <span class="text-[10px] bg-blue-500/20 text-blue-300 px-4 py-1.5 rounded-full font-semibold tracking-wider uppercase border border-blue-400/30">"NOT ME, BUT YOU"</span>
                            <h2 class="text-2xl font-bold tracking-wide text-white pt-1">NSS UNIT JNGP</h2>
                            <p class="text-xs text-slate-400">Govt Polytechnic College, Ramanthapur</p>
                        </div>
                        <p class="text-xs text-slate-300 leading-relaxed px-2">
                            Autonomous volunteer management system logging 240 service hours, departmental attendance tracking, and official certifications.
                        </p>
                        <div class="space-y-3 pt-2">
                            <button onclick="openBoardLoginModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 px-6 rounded-2xl shadow-lg transition flex items-center justify-between cursor-pointer border border-blue-400/30">
                                <div class="flex items-center gap-3"><i class="fa-solid fa-shield-halved text-lg"></i> <span class="text-sm">Board Member Portal</span></div>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                            <button onclick="openStudentLoginModal()" class="w-full glass-box hover:bg-slate-800/80 text-white font-semibold py-3.5 px-6 rounded-2xl shadow-lg transition flex items-center justify-between cursor-pointer border border-slate-700">
                                <div class="flex items-center gap-3"><i class="fa-solid fa-graduation-cap text-lg text-purple-400"></i> <span class="text-sm">Student Sign In</span></div>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                            <button onclick="openDeveloperLoginModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 px-6 rounded-2xl shadow-lg transition flex items-center justify-between cursor-pointer border border-slate-700">
                                <div class="flex items-center gap-3"><i class="fa-solid fa-code text-lg text-emerald-400"></i> <span class="text-sm">Developer Login</span></div>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                `;
            } else if (currentUser.role === 'developer') {
                // Developer Dashboard (Requirement 13)
                container.innerHTML = `
                    <div class="glass-box p-5 rounded-3xl space-y-2 border border-emerald-500/40">
                        <p class="text-xs text-emerald-400 font-semibold">Developer Control Center</p>
                        <h2 class="text-xl font-bold text-white">${currentUser.name}</h2>
                        <p class="text-xs text-slate-400">Authorized System Developer</p>
                    </div>

                    <div class="glass-box p-5 rounded-3xl space-y-3">
                        <h3 class="font-bold text-sm text-white flex items-center gap-2"><i class="fa-solid fa-key text-amber-400"></i> Attendance Edit Requests</h3>
                        <div class="space-y-2 max-h-48 overflow-y-auto">
                            ${editRequests.length === 0 ? '<p class="text-xs text-slate-500 text-center py-2">No pending requests.</p>' : editRequests.map(r => `
                                <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-800 space-y-1">
                                    <p class="text-xs font-bold text-white">${r.boardMember} requested to edit ${r.targetType}</p>
                                    <p class="text-[10px] text-slate-400">Reason: ${r.reason}</p>
                                    <div class="flex gap-2 pt-1">
                                        <button onclick="window.approveEditRequest('${r.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] px-3 py-1 rounded-lg">Approve</button>
                                        <button onclick="window.rejectEditRequest('${r.id}')" class="bg-rose-600 hover:bg-rose-500 text-white text-[10px] px-3 py-1 rounded-lg">Reject</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="glass-box p-5 rounded-3xl space-y-3">
                        <h3 class="font-bold text-sm text-white flex items-center gap-2"><i class="fa-solid fa-clock-rotate-left text-blue-400"></i> Audit Logs</h3>
                        <div class="space-y-2 max-h-52 overflow-y-auto">
                            ${auditLogs.length === 0 ? '<p class="text-xs text-slate-500 text-center py-2">No audit records yet.</p>' : auditLogs.map(l => `
                                <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 text-[10px] space-y-0.5">
                                    <p class="font-semibold text-white">${l.action} by ${l.user}</p>
                                    <p class="text-slate-400">${l.details} • ${l.timestamp}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentUser.role === 'board') {
                // Board Member Dashboard
                container.innerHTML = `
                    <div class="glass-box p-5 rounded-3xl space-y-1">
                        <p class="text-xs text-slate-400">Board Active ${currentUser.designation || 'Technical and financial head'}</p>
                        <h2 class="text-xl font-bold text-white">${currentUser.name}</h2>
                        <p class="text-xs text-slate-400 pt-0.5">PIN: ${currentUser.pin} • Govt Polytechnic Ramanthapur</p>
                    </div>

                    <!-- Separate Attendance Blocks (Requirement 2 & 8) -->
                    <div class="grid grid-cols-2 gap-3">
                        <div onclick="openSubView('session-attendance')" class="glass-box p-4 rounded-2xl hover:border-blue-500/50 transition cursor-pointer space-y-2">
                            <div class="w-10 h-10 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center"><i class="fa-solid fa-clock text-lg"></i></div>
                            <h3 class="font-bold text-sm text-white">Session Attendance</h3>
                            <p class="text-[10px] text-slate-400">Weekly drills & classes</p>
                        </div>
                        <div onclick="openSubView('event-attendance')" class="glass-box p-4 rounded-2xl hover:border-purple-500/50 transition cursor-pointer space-y-2">
                            <div class="w-10 h-10 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center"><i class="fa-solid fa-calendar-check text-lg"></i></div>
                            <h3 class="font-bold text-sm text-white">Event Attendance</h3>
                            <p class="text-[10px] text-slate-400">Special camps & rallies</p>
                        </div>
                        <div onclick="openSubView('register-student')" class="glass-box p-4 rounded-2xl hover:border-emerald-500/50 transition cursor-pointer space-y-2">
                            <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center"><i class="fa-solid fa-user-plus text-lg"></i></div>
                            <h3 class="font-bold text-sm text-white">Register Student</h3>
                            <p class="text-[10px] text-slate-400">Enroll volunteers manually</p>
                        </div>
                        <div onclick="openSubView('broadcast-notice')" class="glass-box p-4 rounded-2xl hover:border-amber-500/50 transition cursor-pointer space-y-2">
                            <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center"><i class="fa-solid fa-bullhorn text-lg"></i></div>
                            <h3 class="font-bold text-sm text-white">Broadcast Notice</h3>
                            <p class="text-[10px] text-slate-400">Push live announcements</p>
                        </div>
                    </div>

                    <!-- Report Download Center (Requirement 5 & 11) -->
                    <div class="glass-box p-5 rounded-3xl space-y-3">
                        <h3 class="font-bold text-sm text-white flex items-center gap-2"><i class="fa-solid fa-file-excel text-emerald-400"></i> Attendance Reports & Downloads</h3>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="window.downloadReport('session')" class="glass-box p-2.5 rounded-xl text-[10px] font-semibold text-blue-300 hover:bg-blue-600/20 transition cursor-pointer">Session CSV</button>
                            <button onclick="window.downloadReport('event')" class="glass-box p-2.5 rounded-xl text-[10px] font-semibold text-purple-300 hover:bg-purple-600/20 transition cursor-pointer">Event CSV</button>
                            <button onclick="window.downloadReport('combined')" class="glass-box p-2.5 rounded-xl text-[10px] font-semibold text-emerald-300 hover:bg-emerald-600/20 transition cursor-pointer">Combined CSV</button>
                        </div>
                    </div>

                    <!-- Branch & Year Student Management (Requirement 3) -->
                    <div class="glass-box p-5 rounded-3xl space-y-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center"><i class="fa-solid fa-users-rectangle text-lg"></i></div>
                            <div>
                                <h3 class="font-bold text-sm text-white">Student Management Directory</h3>
                                <p class="text-[10px] text-slate-400">Manage branch-wise volunteers, view details & remove safely</p>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-4 gap-2 pt-1">
                            ${['CIVIL', 'MECH', 'EEE', 'ECE', 'CHEM', 'MET', 'PKG', 'AME'].map(b => `
                                <button onclick="window.setDirectoryBranch('${b}')" class="dir-branch-btn glass-box py-2 rounded-xl text-[10px] font-semibold ${selectedBranch === b ? 'glass-box-active text-white border-blue-500' : 'text-slate-300 hover:text-white'} transition cursor-pointer">${b}</button>
                            `).join('')}
                        </div>

                        <div class="flex justify-center gap-2 pt-2">
                            ${['1st Year', '2nd Year', '3rd Year'].map(y => `
                                <button onclick="window.setDirectoryYear('${y}')" class="dir-year-btn px-3 py-1.5 rounded-lg text-[11px] font-medium ${selectedYear === y ? 'bg-blue-600 text-white' : 'glass-box text-slate-400'} transition cursor-pointer">${y}</button>
                            `).join('')}
                        </div>

                        <div class="pt-3 border-t border-slate-800 space-y-2 max-h-60 overflow-y-auto">
                            <p class="text-xs font-semibold text-slate-300 pb-1">${selectedBranch} — ${selectedYear}:</p>
                            ${students.filter(s => s.branch === selectedBranch && (s.year || '2nd Year') === selectedYear).length === 0 ? '<p class="text-xs text-slate-500 text-center py-2">No students registered.</p>' : 
                                students.filter(s => s.branch === selectedBranch && (s.year || '2nd Year') === selectedYear).map(s => {
                                    return `
                                        <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-800 flex justify-between items-center text-xs">
                                            <div>
                                                <p class="font-bold text-white">${s.name}</p>
                                                <p class="text-[10px] text-slate-400">PIN: ${s.pin}</p>
                                            </div>
                                            <div class="flex gap-2">
                                                <button onclick="window.viewStudentDetails('${s.pin}')" class="bg-blue-600/30 hover:bg-blue-600/50 text-blue-300 px-2.5 py-1 rounded-lg text-[10px]">View</button>
                                                <button onclick="window.removeStudentModal('${s.pin}')" class="bg-rose-600/30 hover:bg-rose-600/50 text-rose-300 px-2.5 py-1 rounded-lg text-[10px]">Remove</button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                        </div>
                    </div>
                `;
            } else {
                // Student Dashboard with Work Diary & Separate Hour Calculations (Requirement 6 & 7)
                let userAtt = currentUser.attendance || {};
                let userEvents = currentUser.eventsAttended || [];
                
                let sessionCount = Object.values(userAtt).filter(v => v === 'Present').length;
                let sessionHours = sessionCount * 3; // 3 hrs per session
                
                let eventHours = userEvents.reduce((acc, ev) => acc + (ev.hours || 3), 0);
                let combinedTotalHours = sessionHours + eventHours;

                let sessionPct = Math.round((sessionHours / 240) * 100);
                let eventPct = Math.round((eventHours / 240) * 100);
                let combinedPct = Math.round((combinedTotalHours / 240) * 100);

                let workDiaryHtml = userEvents.length === 0 ? '<p class="text-xs text-slate-500 text-center py-3">No event attendance marked yet.</p>' : userEvents.map(ev => `
                    <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-800 space-y-1 text-xs">
                        <div class="flex justify-between items-center">
                            <p class="font-bold text-white">${ev.name}</p>
                            <span class="text-[10px] bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded font-semibold">+${ev.hours || 3} Hours</span>
                        </div>
                        <p class="text-[10px] text-slate-400"><i class="fa-solid fa-calendar mr-1"></i> ${ev.date} • ${ev.time || '10:00 AM'}</p>
                    </div>
                `).join('');

                container.innerHTML = `
                    <div class="glass-box p-5 rounded-3xl space-y-2">
                        <p class="text-xs text-purple-300">Student Volunteer Dashboard</p>
                        <h2 class="text-xl font-bold text-white">${currentUser.name}</h2>
                        <p class="text-xs text-slate-400">PIN: ${currentUser.pin} • Branch: ${currentUser.branch}</p>
                    </div>

                    <!-- Separate Calculations (Requirement 7) -->
                    <div class="glass-box p-5 rounded-3xl space-y-4 border border-blue-500/30">
                        <h3 class="font-bold text-xs text-slate-300 uppercase tracking-wider"><i class="fa-solid fa-hourglass-half text-blue-400 mr-1"></i> 240-Hour Requirement Progress</h3>
                        
                        <!-- Combined Total -->
                        <div class="space-y-1">
                            <div class="flex justify-between text-xs font-semibold">
                                <span class="text-slate-300">Combined Total (Sessions + Events)</span>
                                <span class="text-blue-400">${combinedTotalHours} / 240 Hrs</span>
                            </div>
                            <div class="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-800">
                                <div class="bg-gradient-to-r from-blue-500 to-indigo-500 h-full rounded-full" style="width: ${Math.min(100, combinedPct)}%"></div>
                            </div>
                        </div>

                        <!-- Session Hours Only -->
                        <div class="space-y-1">
                            <div class="flex justify-between text-xs font-semibold">
                                <span class="text-slate-400">Total Session Hours</span>
                                <span class="text-emerald-400">${sessionHours} Hrs</span>
                            </div>
                            <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden border border-slate-800">
                                <div class="bg-emerald-500 h-full rounded-full" style="width: ${Math.min(100, sessionPct)}%"></div>
                            </div>
                        </div>

                        <!-- Event Hours Only -->
                        <div class="space-y-1">
                            <div class="flex justify-between text-xs font-semibold">
                                <span class="text-slate-400">Total Event Hours Progress</span>
                                <span class="text-purple-400">${eventHours} / 240 Hrs</span>
                            </div>
                            <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden border border-slate-800">
                                <div class="bg-purple-500 h-full rounded-full" style="width: ${Math.min(100, eventPct)}%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Work Diary Feature (Requirement 6) -->
                    <div class="glass-box p-5 rounded-3xl space-y-3">
                        <h3 class="font-bold text-xs text-slate-300 uppercase tracking-wider flex items-center gap-2"><i class="fa-solid fa-book-open text-amber-400"></i> Work Diary (Event History)</h3>
                        <div class="space-y-2 max-h-52 overflow-y-auto">
                            ${workDiaryHtml}

        window.submitAttendanceBatch = async function() {
            const date = document.getElementById('sess-date').value;
            const filtered = students.filter(s => s.branch === selectedBranch && (s.year || '2nd Year') === selectedYear);
            try {
                for(let s of filtered) {
                    const chk = document.getElementById(`chk-${s.pin}`);
                    const status = chk && chk.checked ? 'Present' : 'Absent';
                    let att = s.attendance || {};
                    att[date] = status;
                    await updateDoc(doc(db, "students", s.pin), { attendance: att });
                }
                alert('Session attendance recorded successfully!');
                closeSubView();
            } catch(e) { alert('Failed to save attendance.'); }
        };

        window.submitEventAttendanceBatch = async function() {
            const eventId = document.getElementById('event-select').value;
            const evObj = events.find(e => e.id === eventId) || { name: 'Special NSS Camp', date: new Date().toISOString().split('T')[0], hours: 3 };
            const filtered = students.filter(s => s.branch === selectedBranch);

            try {
                for(let s of filtered) {
                    const chk = document.getElementById(`ev-chk-${s.pin}`);
                    if(chk && chk.checked) {
                        let evList = s.eventsAttended || [];
                        if(!evList.some(item => item.name === evObj.name && item.date === evObj.date)) {
                            evList.push({ name: evObj.name, date: evObj.date, hours: evObj.hours || 3 });
                            await updateDoc(doc(db, "students", s.pin), { eventsAttended: evList });

        window.downloadReport = function(type) {
            let csvContent = "data:text/csv;charset=utf-8,";
            if(type === 'session') {
                csvContent += "PIN,Name,Branch,Year,Total Session Hours\n";
                students.forEach(s => {
                    let count = s.attendance ? Object.values(s.attendance).filter(v => v === 'Present').length : 0;
                    csvContent += `${s.pin},${s.name},${s.branch},${s.year || '2nd Year'},${count * 3}\n`;
                });
            } else if(type === 'event') {
                csvContent += "PIN,Name,Branch,Event Name,Event Date,Hours\n";
                students.forEach(s => {
                    if(s.eventsAttended) {
                        s.eventsAttended.forEach(ev => {
                            csvContent += `${s.pin},${s.name},${s.branch},${ev.name},${ev.date},${ev.hours || 3}\n`;
                        });
                    }
                });
            } else {
                csvContent += "PIN,Name,Branch,Session Hours,Event Hours,Combined Total\n";
                students.forEach(s => {
                    let sess = s.attendance ? Object.values(s.attendance).filter(v => v === 'Present').length * 3 : 0;
                    let evs = s.eventsAttended ? s.eventsAttended.reduce((acc, ev) => acc + (ev.hours || 3), 0) : 0;
                    csvContent += `${s.pin},${s.name},${s.branch},${sess},${evs},${sess + evs}\n`;
                });
            }
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `NSS_${type}_attendance_report.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        }

        function renderProfile(container) {
            if(!currentUser) return container.innerHTML = `<div class="glass-box p-6 rounded-3xl text-center"><p class="text-xs text-slate-400">Please sign in.</p></div>`;
            container.innerHTML = `
                <div class="glass-box p-5 rounded-3xl space-y-4">
                    <h2 class="text-base font-bold text-white"><i class="fa-solid fa-id-card text-blue-400 mr-2"></i> User Identity & Profile</h2>
                    <div class="space-y-3">
                        <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800"><p class="text-[10px] text-slate-400 font-semibold">ROLE</p><p class="text-sm font-bold text-white mt-0.5">${currentUser.role === 'developer' ? 'System Developer' : (currentUser.role === 'board' ? currentUser.designation || 'Technical and financial head' : 'Student Volunteer')}</p></div>
                        <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800"><p class="text-[10px] text-slate-400 font-semibold">FULL NAME & PIN</p><p class="text-sm font-bold text-white mt-0.5">${currentUser.name} (${currentUser.pin})</p></div>
                        <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800"><p class="text-[10px] text-slate-400 font-semibold">DEPARTMENT & YEAR</p><p class="text-sm font-bold text-white mt-0.5">${currentUser.role === 'board' || currentUser.role === 'developer' ? 'JNGP NSS Unit Administration' : currentUser.branch + ' (' + (currentUser.year || '2nd Year') + ')'}</p></div>
                    </div>
                </div>
            `;
        }

        // Login Modals (Ensuring strict role separation - Requirement 1 & 13)
        window.openBoardLoginModal = function() {
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                    <div class="glass-box w-full max-w-sm rounded-3xl p-6 space-y-4 relative border border-slate-700 shadow-2xl">
                        <button onclick="window.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
                        <h3 class="text-base font-bold text-white">Board Executive Access</h3>
                        <p class="text-xs text-slate-400">Enter secret passcode & profile details</p>
                        <div class="space-y-3 pt-1">
                            <label class="text-[10px] text-slate-400 font-semibold block">DEVELOPER SECRET PASSCODE</label>
                            <input type="password" id="login-passcode" placeholder="••••••••" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">

                            <label class="text-[10px] text-slate-400 font-semibold block">BOARD MEMBER FULL NAME</label>
                            <input type="text" id="login-name" value="Shaik altaf" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">

                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="text-[10px] text-slate-400 font-semibold block">BOARD MEMBER PIN</label><input type="text" id="login-pin" value="25002-EC-026" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white"></div>
                                <div><label class="text-[10px] text-slate-400 font-semibold block">OFFICIAL DESIGNATION</label><input type="text" id="login-desig" value="Technical and financial head" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white"></div>
                            </div>

                            <button onclick="window.verifyBoardLogin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 rounded-2xl shadow-lg transition cursor-pointer mt-2 flex items-center justify-center gap-2"><span>Verify & Continue</span> <i class="fa-solid fa-arrow-right"></i></button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.openStudentLoginModal = function() {
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                    <div class="glass-box w-full max-w-sm rounded-3xl p-6 space-y-4 relative border border-slate-700 shadow-2xl">
                        <button onclick="window.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
                        <h3 class="text-base font-bold text-white">Student Sign In</h3>
                        <p class="text-xs text-slate-400">Check 240-hour requirement progress, attendance log & Work Diary</p>
                        <div class="space-y-3 pt-2">
                            <input type="text" id="student-login-pin" placeholder="e.g. 25002-EC-026" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white uppercase">
                            <button onclick="window.verifyStudentLogin()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3.5 rounded-2xl shadow-lg transition cursor-pointer">Login to Dashboard</button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.openDeveloperLoginModal = function() {
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                    <div class="glass-box w-full max-w-sm rounded-3xl p-6 space-y-4 relative border border-emerald-500/40 shadow-2xl">
                        <button onclick="window.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
                        <h3 class="text-base font-bold text-white">Developer Secure Login</h3>
                        <p class="text-xs text-slate-400">Enter authorized developer credentials (e.g. DEV-001)</p>
                        <div class="space-y-3 pt-2">
                            <input type="text" id="dev-pin" placeholder="Developer PIN (DEV-001)" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white uppercase">
                            <input type="password" id="dev-pass" placeholder="Secret Key (1947)" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                            <button onclick="window.verifyDeveloperLogin()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 rounded-2xl shadow-lg transition cursor-pointer">Developer Access</button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.verifyBoardLogin = function() {
            const pass = document.getElementById('login-passcode').value;
            if (pass === '1947') {
                currentUser = {
                    role: 'board',
                    name: document.getElementById('login-name').value,
                    pin: document.getElementById('login-pin').value,
                    designation: document.getElementById('login-desig').value
                };
                localStorage.setItem('nss_current_user', JSON.stringify(currentUser));
                window.closeModal();
                renderUI();
            } else { alert('Invalid passcode!'); }
        };

        window.verifyStudentLogin = async function() {
            const pin = document.getElementById('student-login-pin').value.trim().toUpperCase();
            const snap = await getDoc(doc(db, "students", pin));
            if(snap.exists()) {
                currentUser = { role: 'student', ...snap.data() };
                localStorage.setItem('nss_current_user', JSON.stringify(currentUser));
                window.closeModal();
                renderUI();
            } else { alert('Student PIN not found in database.'); }
        };

        window.verifyDeveloperLogin = function() {
            const pin = document.getElementById('dev-pin').value.trim().toUpperCase();
            const pass = document.getElementById('dev-pass').value;
            if(authorizedDevelopers.includes(pin) && pass === '1947') {
                currentUser = { role: 'developer', name: 'Lead System Developer', pin: pin };
                localStorage.setItem('nss_current_user', JSON.stringify(currentUser));
                window.closeModal();
                renderUI();
            } else { alert('Unauthorized developer credentials.'); }
        };

        window.closeModal = function() { document.getElementById('modal-container').innerHTML = ''; };
        window.logout = function() { currentUser = null; localStorage.removeItem('nss_current_user'); renderUI(); };
    </script>
</body>
</html>

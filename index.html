<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSS Unit JNGP | Official Community & Attendance System</title>
    <!-- PWA Manifest Meta Tags -->
    <meta name="theme-color" content="#050b14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NSS JNGP">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
      %22name%22: %22NSS Unit JNGP%22,
      %22short_name%22: %22NSS JNGP%22,
      %22start_url%22: %22.%22,
      %22display%22: %22standalone%22,
      %22background_color%22: %22%23050b14%22,
      %22theme_color%22: %22%23050b14%22,
      %22icons%22: [{
        %22src%22: %22https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=192%22,
        %22sizes%22: %22192x192%22,
        %22type%22: %22image/png%22
      }]
    }">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #050b14; color: #f8fafc; }
        .glass-box { background: rgba(15, 28, 51, 0.75); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-box-active { background: rgba(30, 58, 138, 0.25); border: 1px solid rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="min-h-screen pb-24 relative">
    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col justify-between p-4">
        
        <!-- Top Header -->
        <header class="flex justify-between items-center py-3 border-b border-slate-800/80 mb-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="font-bold text-xs tracking-wide text-white">NSS UNIT JNGP</h1>
                    <p class="text-[10px] text-slate-400" id="header-subtitle">Govt Polytechnic Ramanthapur</p>
                </div>
            </div>
            <div id="header-action"></div>
        </header>

        <!-- Main View Area -->
        <main id="main-container" class="flex-1 space-y-4 pb-16"></main>

        <!-- Bottom Navigation Bar -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#071120] border-t border-slate-800/80 flex justify-around py-3 px-2 z-30 shadow-2xl">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-blue-500 text-xs font-semibold cursor-pointer">
                <i class="fa-solid fa-house text-lg"></i> Home
            </button>
            <button onclick="switchTab('events')" id="nav-events" class="flex flex-col items-center text-slate-500 text-xs font-medium cursor-pointer">
                <i class="fa-solid fa-calendar-days text-lg"></i> Events
            </button>
            <button onclick="switchTab('messages')" id="nav-messages" class="flex flex-col items-center text-slate-500 text-xs font-medium cursor-pointer">
                <i class="fa-solid fa-bullhorn text-lg"></i> Notice Board
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-slate-500 text-xs font-medium cursor-pointer">
                <i class="fa-solid fa-id-card text-lg"></i> Profile
            </button>
        </nav>
    </div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, addDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgYi6crYP7Em-z32TeIjHpUPfLGMNWFDY",
            authDomain: "nss-unit-jngp.firebaseapp.com",
            projectId: "nss-unit-jngp",
            storageBucket: "nss-unit-jngp.firebasestorage.app",
            messagingSenderId: "827655385529",
            appId: "1:827655385529:web:6df3292b78aef040a68668",
            measurementId: "G-294DT88D4R"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = JSON.parse(localStorage.getItem('nss_current_user')) || null;
        let students = [];
        let messages = [];
        let events = [];
        let currentTab = 'home';
        let currentSubView = null; 
        let selectedBranch = 'CIVIL';
        let selectedYear = '2nd Year';

        function initSync() {
            onSnapshot(collection(db, "students"), snap => {
                students = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
            });
            onSnapshot(collection(db, "messages"), snap => {
                messages = snap.docs.map(d => d.data());
                renderUI();
            });
            onSnapshot(collection(db, "events"), snap => {
                events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
            });
        }

        initSync();

        window.switchTab = function(tab) {
            currentTab = tab;
            currentSubView = null;
            ['home', 'events', 'messages', 'profile'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if(btn) btn.className = t === tab ? 'flex flex-col items-center text-blue-500 text-xs font-semibold cursor-pointer' : 'flex flex-col items-center text-slate-500 text-xs font-medium cursor-pointer';
            });
            renderUI();
        };

        window.openSubView = function(view) {
            currentSubView = view;
            renderUI();
        };

        window.closeSubView = function() {
            currentSubView = null;
            renderUI();
        };

        function renderUI() {
            const headerAction = document.getElementById('header-action');
            const subTitle = document.getElementById('header-subtitle');
            const container = document.getElementById('main-container');

            if (currentUser) {
                subTitle.innerText = `${currentUser.role === 'board' ? currentUser.designation || 'Technical and financial head' : currentUser.branch + ' Student'} (${currentUser.pin})`;
                headerAction.innerHTML = `<button onclick="logout()" class="bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 text-xs px-3 py-1.5 rounded-xl border border-rose-500/30 transition cursor-pointer flex items-center gap-1.5"><i class="fa-solid fa-arrow-right-from-bracket"></i> Exit</button>`;
            } else {
                subTitle.innerText = 'Govt Polytechnic Ramanthapur';
                headerAction.innerHTML = '';
            }

            if (currentSubView) {
                renderSubViewContent(container);
                return;
            }

            if (currentTab === 'home') renderHome(container);
            else if (currentTab === 'events') renderEvents(container);
            else if (currentTab === 'messages') renderMessages(container);
            else if (currentTab === 'profile') renderProfile(container);
        }

        function renderHome(container) {
            if (!currentUser) {
                // Exact Landing Page matching Screenshot 12829.jpg
                container.innerHTML = `
                    <div class="glass-box p-6 rounded-3xl space-y-5 shadow-2xl">
                        <div class="flex justify-center items-center gap-4 py-2">
                            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150" class="w-16 h-16 rounded-full border-2 border-white/20 object-cover bg-white shadow-md">
                            <img src="https://images.unsplash.com/photo-1541339907198-e08756dedf3f?w=150" class="w-16 h-16 rounded-full border-2 border-white/20 object-cover bg-white shadow-md">
                        </div>
                        <div class="text-center space-y-1">
                            <span class="text-[10px] bg-blue-500/20 text-blue-300 px-3.5 py-1 rounded-full font-semibold tracking-wider">"NOT ME, BUT YOU"</span>
                            <h2 class="text-2xl font-bold tracking-wide mt-2 text-white">NSS UNIT JNGP</h2>
                            <p class="text-xs text-slate-400">Govt Polytechnic College, Ramanthapur</p>
                        </div>
                        <p class="text-xs text-slate-300 text-center leading-relaxed px-2">
                            Autonomous volunteer management system logging 240 service hours, departmental attendance tracking, and official certifications.
                        </p>
                        <div class="space-y-3 pt-2">
                            <button onclick="openBoardLoginModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-4 px-6 rounded-2xl shadow-lg transition flex items-center justify-between cursor-pointer border border-blue-400/30">
                                <div class="flex items-center gap-3"><i class="fa-solid fa-shield-halved text-lg"></i> <span class="text-sm">Board Member Portal</span></div>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                            <button onclick="openStudentLoginModal()" class="w-full glass-box hover:bg-slate-800/80 text-white font-semibold py-4 px-6 rounded-2xl shadow-lg transition flex items-center justify-between cursor-pointer border border-slate-700">
                                <div class="flex items-center gap-3"><i class="fa-solid fa-graduation-cap text-lg text-purple-400"></i> <span class="text-sm">Student Sign In</span></div>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                `;
            } else if (currentUser.role === 'board') {
                // Exact Dashboard matching Screenshot 12825.jpg
                container.innerHTML = `
                    <div class="glass-box p-5 rounded-3xl space-y-1">
                        <p class="text-xs text-slate-400">Board Active ${currentUser.designation || 'Technical and financial head'}</p>
                        <h2 class="text-xl font-bold text-white">${currentUser.name}</h2>
                        <p class="text-xs text-slate-400 pt-0.5">PIN: ${currentUser.pin} • Govt Polytechnic Ramanthapur</p>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div onclick="openSubView('session-attendance')" class="glass-box p-4 rounded-2xl hover:border-blue-500/50 transition cursor-pointer space-y-2">
                            <div class="w-10 h-10 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center"><i class="fa-solid fa-clock text-lg"></i></div>
                            <h3 class="font-bold text-sm text-white">Session Attendance</h3>
                            <p class="text-[10px] text-slate-400">Weekly drills & classes</p>
                        </div>
                        <div onclick="openSubView('event-attendance')" class="glass-box p-4 rounded-2xl hover:border-purple-500/50 transition cursor-pointer space-y-2">
                            <div class="w-10 h-10 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center"><i class="fa-solid fa-calendar-check text-lg"></i></div>
                            <h3 class="font-bold text-sm text-white">Event Attendance</h3>
                            <p class="text-[10px] text-slate-400">Special camps & rallies</p>
                        </div>
                        <div onclick="openSubView('register-student')" class="glass-box p-4 rounded-2xl hover:border-emerald-500/50 transition cursor-pointer space-y-2">
                            <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center"><i class="fa-solid fa-user-plus text-lg"></i></div>
                            <h3 class="font-bold text-sm text-white">Register Student</h3>
                            <p class="text-[10px] text-slate-400">Enroll volunteers manually</p>
                        </div>
                        <div onclick="openSubView('broadcast-notice')" class="glass-box p-4 rounded-2xl hover:border-amber-500/50 transition cursor-pointer space-y-2">
                            <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center"><i class="fa-solid fa-bullhorn text-lg"></i></div>
                            <h3 class="font-bold text-sm text-white">Broadcast Notice</h3>
                            <p class="text-[10px] text-slate-400">Push live announcements</p>
                        </div>
                    </div>

                    <!-- Department Student Directory matching Screenshot 12825.jpg & 12815.jpg -->
                    <div class="glass-box p-5 rounded-3xl space-y-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center"><i class="fa-solid fa-users-rectangle text-lg"></i></div>
                            <div>
                                <h3 class="font-bold text-sm text-white">Department Student Directory</h3>
                                <p class="text-[10px] text-slate-400">Explore volunteers across all 8 branches, inspect reports & manage records</p>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-4 gap-2 pt-1">
                            ${['CIVIL', 'MECH', 'EEE', 'ECE', 'CHEM', 'MET', 'PKG', 'AME'].map(b => `
                                <button onclick="window.setDirectoryBranch('${b}')" class="dir-branch-btn glass-box py-2 rounded-xl text-[10px] font-semibold ${selectedBranch === b ? 'glass-box-active text-white border-blue-500' : 'text-slate-300 hover:text-white'} transition cursor-pointer">${b}</button>
                            `).join('')}
                        </div>

                        <div class="flex justify-center gap-2 pt-2">
                            ${['1st Year', '2nd Year', '3rd Year'].map(y => `
                                <button onclick="window.setDirectoryYear('${y}')" class="dir-year-btn px-3 py-1.5 rounded-lg text-[11px] font-medium ${selectedYear === y ? 'bg-blue-600 text-white' : 'glass-box text-slate-400'} transition cursor-pointer">${y}</button>
                            `).join('')}
                        </div>

                        <div class="pt-2 border-t border-slate-800 text-center">
                            <p class="text-xs font-semibold text-slate-300">${selectedBranch} — ${selectedYear}</p>
                            <p class="text-[10px] text-slate-500 mt-1">${students.filter(s => s.branch === selectedBranch && (s.year || '2nd Year') === selectedYear).length} Registered</p>
                        </div>
                    </div>
                `;
            } else {
                let userAtt = currentUser.attendance || {};
                let totalClasses = Object.keys(userAtt).length;
                let presentCount = Object.values(userAtt).filter(v => v === 'Present').length;
                let pct = totalClasses > 0 ? Math.round((presentCount / totalClasses) * 100) : 0;
                let serviceHours = presentCount * 3;

                container.innerHTML = `
                    <div class="glass-box p-5 rounded-3xl space-y-2">
                        <p class="text-xs text-purple-300">Student Volunteer Dashboard</p>
                        <h2 class="text-xl font-bold text-white">${currentUser.name}</h2>
                        <p class="text-xs text-slate-400">PIN: ${currentUser.pin} • Branch: ${currentUser.branch}</p>
                    </div>

                    <div class="glass-box p-5 rounded-3xl space-y-3 border border-blue-500/30">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-xs text-slate-300 uppercase tracking-wider"><i class="fa-solid fa-hourglass-half text-blue-400 mr-1"></i> 240-Hour Service Goal</h3>
                            <span class="text-xs font-bold text-blue-400">${serviceHours} / 240 Hrs</span>
                        </div>
                        <div class="w-full bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-800">
                            <div class="bg-gradient-to-r from-blue-500 to-indigo-500 h-full rounded-full transition-all duration-500" style="width: ${Math.min(100, (serviceHours/240)*100)}%"></div>
                        </div>
                    </div>

                    <div class="glass-box p-5 rounded-3xl space-y-3">
                        <h3 class="font-bold text-xs text-slate-300 uppercase tracking-wider"><i class="fa-solid fa-chart-pie text-emerald-400 mr-1"></i> Attendance Metrics</h3>
                        <div class="grid grid-cols-3 gap-2 text-center">
                            <div class="bg-slate-900/60 p-3 rounded-2xl border border-slate-800"><p class="text-[10px] text-slate-400">Total</p><p class="text-base font-bold text-white mt-1">${totalClasses}</p></div>
                            <div class="bg-slate-900/60 p-3 rounded-2xl border border-slate-800"><p class="text-[10px] text-slate-400">Present</p><p class="text-base font-bold text-emerald-400 mt-1">${presentCount}</p></div>
                            <div class="bg-slate-900/60 p-3 rounded-2xl border border-slate-800"><p class="text-[10px] text-slate-400">Ratio</p><p class="text-base font-bold text-blue-400 mt-1">${pct}%</p></div>
                        </div>
                    </div>
                `;
            }
        }

        function renderSubViewContent(container) {
            if (currentSubView === 'session-attendance') {
                // Exact match for Screenshot 12821.jpg & 12823.jpg
                container.innerHTML = `
                    <div class="glass-box p-5 rounded-3xl space-y-4">
                        <div class="flex items-center gap-3">
                            <button onclick="closeSubView()" class="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center text-slate-300 hover:text-white cursor-pointer"><i class="fa-solid fa-arrow-left"></i></button>
                            <div>
                                <h3 class="font-bold text-sm text-white">Create Session Attendance</h3>
                                <p class="text-[10px] text-slate-400">Configure session & mark roster</p>
                            </div>
                        </div>
                        
                        <div class="space-y-3">
                            <label class="text-[10px] text-slate-400 font-semibold block">SESSION TITLE</label>
                            <input type="text" id="sess-title" placeholder="e.g. Session 1: Orientation & Cleanliness" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                            
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="text-[10px] text-slate-400 font-semibold block mb-1">DATE</label>
                                    <input type="date" id="sess-date" value="${new Date().toISOString().split('T')[0]}" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                                </div>
                                <div>
                                    <label class="text-[10px] text-slate-400 font-semibold block mb-1">HOURS CREDIT</label>
                                    <select id="sess-hours" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                                        <option value="3">3 Hours (Standard)</option>
                                        <option value="4">4 Hours</option>
                                        <option value="6">6 Hours</option>
                                    </select>
                                </div>
                            </div>

                            <label class="text-[10px] text-slate-400 font-semibold block pt-2">SELECT BRANCH:</label>
                            <div class="grid grid-cols-4 gap-2">
                                ${['CIVIL', 'MECH', 'EEE', 'ECE', 'CHEM', 'MET', 'PKG', 'AME'].map(b => `
                                    <button onclick="window.selectAttendanceBranch('${b}')" id="btn-branch-${b}" class="branch-btn glass-box py-2.5 rounded-xl text-xs font-semibold ${selectedBranch === b ? 'border-blue-500 bg-blue-600/20 text-white' : 'text-slate-300'} transition cursor-pointer">${b}</button>
                                `).join('')}
                            </div>

                            <div class="flex justify-center gap-2 pt-1">
                                ${['1st Year', '2nd Year', '3rd Year'].map(y => `
                                    <button onclick="window.selectAttendanceYear('${y}')" id="btn-year-${y}" class="year-btn px-3 py-1 rounded-lg text-[11px] font-medium ${selectedYear === y ? 'bg-purple-600 text-white' : 'glass-box text-slate-400'} transition cursor-pointer">${y}</button>
                                `).join('')}
                            </div>

                            <div id="branch-roster-area" class="pt-2"></div>
                        </div>
                    </div>
                `;
                window.selectAttendanceBranch(selectedBranch);
            } else if (currentSubView === 'event-attendance') {
                container.innerHTML = `
                    <div class="glass-box p-5 rounded-3xl space-y-4">
                        <div class="flex items-center gap-3">
                            <button onclick="closeSubView()" class="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center text-slate-300 hover:text-white cursor-pointer"><i class="fa-solid fa-arrow-left"></i></button>
                            <div><h3 class="font-bold text-sm text-white">Event Attendance</h3><p class="text-[10px] text-slate-400">Special camps & rallies</p></div>
                        </div>
                        <div class="space-y-2">
                            ${events.length === 0 ? '<p class="text-xs text-slate-500 text-center py-4">No events posted.</p>' : events.map(e => `
                                <div class="bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800 flex justify-between items-center">
                                    <div><h4 class="font-bold text-xs text-white">${e.name}</h4><p class="text-[10px] text-slate-400">${e.date} •${e.venue}</p></div>
                                    <button onclick="alert('Event attendance logged!')" class="bg-purple-600 hover:bg-purple-500 text-white text-[10px] px-3 py-1.5 rounded-xl font-medium cursor-pointer">Log Camp</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentSubView === 'register-student') {
                // Exact match for Screenshot 12817.jpg
                container.innerHTML = `
                    <div class="glass-box p-5 rounded-3xl space-y-4">
                        <div class="flex items-center gap-3">
                            <button onclick="closeSubView()" class="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center text-slate-300 hover:text-white cursor-pointer"><i class="fa-solid fa-arrow-left"></i></button>
                            <div><h3 class="font-bold text-sm text-white">Student Registration</h3><p class="text-[10px] text-slate-400">Manual volunteer onboarding</p></div>
                        </div>
                        <div class="space-y-3">
                            <label class="text-[10px] text-slate-400 font-semibold block">STUDENT FULL NAME</label>
                            <input type="text" id="reg-name" placeholder="e.g. Shaik Altaf" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">

                            <label class="text-[10px] text-slate-400 font-semibold block">STUDENT PIN NUMBER</label>
                            <input type="text" id="reg-pin" placeholder="E.G. 25002-EC-026" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white uppercase">

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="text-[10px] text-slate-400 font-semibold block mb-1">DEPARTMENT / BRANCH</label>
                                    <select id="reg-branch" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                                        ${['CIVIL', 'MECH', 'EEE', 'ECE', 'CHEM', 'MET', 'PKG', 'AME'].map(b => `<option value="${b}">${b}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="text-[10px] text-slate-400 font-semibold block mb-1">ACADEMIC YEAR</label>
                                    <select id="reg-year" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                                        <option value="1st Year">1st Year</option>
                                        <option value="2nd Year" selected>2nd Year</option>
                                        <option value="3rd Year">3rd Year</option>
                                    </select>
                                </div>
                            </div>
                            <button onclick="window.registerStudentAction()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 rounded-2xl shadow-lg transition cursor-pointer mt-2"><i class="fa-solid fa-floppy-disk mr-2"></i> Save & Register Student</button>
                        </div>
                    </div>
                `;
            } else if (currentSubView === 'broadcast-notice') {
                container.innerHTML = `
                    <div class="glass-box p-5 rounded-3xl space-y-4">
                        <div class="flex items-center gap-3">
                            <button onclick="closeSubView()" class="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center text-slate-300 hover:text-white cursor-pointer"><i class="fa-solid fa-arrow-left"></i></button>
                            <div><h3 class="font-bold text-sm text-white">Broadcast Notice</h3><p class="text-[10px] text-slate-400">Push live announcements</p></div>
                        </div>
                        <div class="space-y-3">
                            <label class="text-[10px] text-slate-400 font-semibold block">NOTICE TITLE</label>
                            <input type="text" id="notice-title" placeholder="e.g. Blood Donation Camp" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">
                            <label class="text-[10px] text-slate-400 font-semibold block">MESSAGE CONTENT</label>
                            <textarea id="notice-content" rows="4" placeholder="Enter announcement..." class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white"></textarea>
                            <button onclick="window.broadcastNoticeAction()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-2xl shadow-lg transition cursor-pointer">Publish Live Broadcast</button>
                        </div>
                    </div>
                `;
            }
        }

        window.setDirectoryBranch = function(b) {
            selectedBranch = b;
            renderUI();
        };

        window.setDirectoryYear = function(y) {
            selectedYear = y;
            renderUI();
        };

        window.selectAttendanceBranch = function(b) {
            selectedBranch = b;
            document.querySelectorAll('.branch-btn').forEach(btn => btn.classList.remove('border-blue-500', 'bg-blue-600/20'));
            const el = document.getElementById(`btn-branch-${b}`);
            if(el) el.classList.add('border-blue-500', 'bg-blue-600/20');
            renderAttendanceRoster();
        };

        window.selectAttendanceYear = function(y) {
            selectedYear = y;
            document.querySelectorAll('.year-btn').forEach(btn => btn.className = 'year-btn px-3 py-1 rounded-lg text-[11px] font-medium glass-box text-slate-400 transition cursor-pointer');
            const el = document.getElementById(`btn-year-${y}`);
            if(el) el.className = 'year-btn px-3 py-1 rounded-lg text-[11px] font-medium bg-purple-600 text-white transition cursor-pointer';
            renderAttendanceRoster();
        };

        function renderAttendanceRoster() {
            const rosterArea = document.getElementById('branch-roster-area');
            if(!rosterArea) return;
            const filtered = students.filter(s => s.branch === selectedBranch && (s.year || '2nd Year') === selectedYear);

            if (filtered.length === 0) {
                rosterArea.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">No students registered for ${selectedBranch} (${selectedYear}).</p>`;
                return;
            }

            rosterArea.innerHTML = `
                <div class="space-y-2 pt-2 max-h-56 overflow-y-auto">
                    ${filtered.map(s => `
                        <div class="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 text-xs">
                            <div><p class="font-bold text-white">${s.name}</p><p class="text-[10px] text-slate-400">${s.pin}</p></div>
                            <select id="att-status-${s.pin}" class="px-2.5 py-1 bg-slate-800 border border-slate-700 rounded-lg text-xs font-semibold text-emerald-400">
                                <option value="Present" selected>Present</option>
                                <option value="Absent">Absent</option>
                            </select>
                        </div>
                    `).join('')}
                    <button onclick="window.submitAttendanceBatch()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl text-xs mt-3 cursor-pointer"><i class="fa-solid fa-check mr-2"></i> Attendance Completed</button>
                </div>
            `;
        }

        window.submitAttendanceBatch = async function() {
            const date = document.getElementById('sess-date').value;
            const filtered = students.filter(s => s.branch === selectedBranch && (s.year || '2nd Year') === selectedYear);
            try {
                for(let s of filtered) {
                    const sel = document.getElementById(`att-status-${s.pin}`);
                    const status = sel ? sel.value : 'Present';
                    let att = s.attendance || {};
                    att[date] = status;
                    await updateDoc(doc(db, "students", s.pin), { attendance: att });
                }
                alert('Attendance successfully recorded!');
                closeSubView();
            } catch(e) {
                console.error(e);
                alert('Failed to save attendance.');
            }
        };

        window.registerStudentAction = async function() {
            const name = document.getElementById('reg-name').value.trim();
            const pin = document.getElementById('reg-pin').value.trim().toUpperCase();
            const branch = document.getElementById('reg-branch').value;
            const year = document.getElementById('reg-year').value;
            if(!name || !pin) return alert('Please enter name and PIN.');
            try {
                await setDoc(doc(db, "students", pin), { name, pin, branch, year, attendance: {} });
                alert('Student successfully registered!');
                closeSubView();
            } catch(e) {
                alert('Registration failed.');
            }
        };

        window.broadcastNoticeAction = async function() {
            const title = document.getElementById('notice-title').value.trim();
            const content = document.getElementById('notice-content').value.trim();
            if(!title || !content) return alert('Fill all fields.');
            try {
                await addDoc(collection(db, "messages"), { title, content, date: new Date().toISOString().split('T')[0] });
                alert('Notice broadcasted successfully!');
                closeSubView();
            } catch(e) { alert('Broadcast failed.'); }
        };

        function renderEvents(container) {
            container.innerHTML = `
                <div class="glass-box p-5 rounded-3xl space-y-4">
                    <h2 class="text-base font-bold text-white"><i class="fa-solid fa-calendar-days text-purple-400 mr-2"></i> Upcoming Events</h2>
                    <div class="space-y-3">
                        ${events.length === 0 ? '<p class="text-xs text-slate-500 text-center py-4">No events scheduled.</p>' : events.map(e => `
                            <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 space-y-1">
                                <div class="flex justify-between items-center"><h3 class="font-bold text-xs text-white">${e.name}</h3><span class="text-[10px] bg-purple-500/20 text-purple-300 px-2.5 py-0.5 rounded-full font-medium">${e.date}</span></div>
                                <p class="text-xs text-slate-400"><i class="fa-solid fa-location-dot mr-1"></i> ${e.venue}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderMessages(container) {
            container.innerHTML = `
                <div class="glass-box p-5 rounded-3xl space-y-4">
                    <h2 class="text-base font-bold text-white"><i class="fa-solid fa-bullhorn text-amber-400 mr-2"></i> Notice Board</h2>
                    <div class="space-y-3">
                        ${messages.length === 0 ? '<p class="text-xs text-slate-500 text-center py-4">No active notices.</p>' : messages.map(m => `
                            <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 space-y-1">
                                <div class="flex justify-between items-center"><h3 class="font-bold text-xs text-white">${m.title}</h3><span class="text-[10px] text-slate-500">${m.date}</span></div>
                                <p class="text-xs text-slate-300">${m.content}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderProfile(container) {
            if(!currentUser) return container.innerHTML = `<div class="glass-box p-6 rounded-3xl text-center"><p class="text-xs text-slate-400">Please sign in.</p></div>`;
            // Exact match for Screenshot 12819.jpg
            container.innerHTML = `
                <div class="glass-box p-5 rounded-3xl space-y-4">
                    <h2 class="text-base font-bold text-white"><i class="fa-solid fa-id-card text-blue-400 mr-2"></i> User Identity & Profile</h2>
                    <div class="space-y-3">
                        <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800"><p class="text-[10px] text-slate-400 font-semibold">ROLE</p><p class="text-sm font-bold text-white mt-0.5">${currentUser.role === 'board' ? currentUser.designation || 'Technical and financial head' : 'Student Volunteer'}</p></div>
                        <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800"><p class="text-[10px] text-slate-400 font-semibold">FULL NAME & PIN</p><p class="text-sm font-bold text-white mt-0.5">${currentUser.name} (${currentUser.pin})</p></div>
                        <div class="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800"><p class="text-[10px] text-slate-400 font-semibold">DEPARTMENT & YEAR</p><p class="text-sm font-bold text-white mt-0.5">${currentUser.role === 'board' ? 'JNGP NSS Unit Administration' : currentUser.branch + ' (' + (currentUser.year || '2nd Year') + ')'}</p></div>
                    </div>
                </div>
            `;
        }

        // Exact match for Screenshot 12827.jpg
        window.openBoardLoginModal = function() {
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                    <div class="glass-box w-full max-w-sm rounded-3xl p-6 space-y-4 relative border border-slate-700 shadow-2xl">
                        <button onclick="window.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
                        <h3 class="text-base font-bold text-white">Board Executive Access</h3>
                        <p class="text-xs text-slate-400">Enter secret passcode & profile details</p>
                        <div class="space-y-3 pt-1">
                            <label class="text-[10px] text-slate-400 font-semibold block">DEVELOPER SECRET PASSCODE</label>
                            <input type="password" id="login-passcode" placeholder="••••••••" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">

                            <label class="text-[10px] text-slate-400 font-semibold block">BOARD MEMBER FULL NAME</label>
                            <input type="text" id="login-name" value="Shaik altaf" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white">

                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="text-[10px] text-slate-400 font-semibold block">BOARD MEMBER PIN</label><input type="text" id="login-pin" value="25002-EC-026" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white"></div>
                                <div><label class="text-[10px] text-slate-400 font-semibold block">OFFICIAL DESIGNATION</label><input type="text" id="login-desig" value="Technical and financial head" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white"></div>
                            </div>

                            <button onclick="window.verifyBoardLogin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 rounded-2xl shadow-lg transition cursor-pointer mt-2 flex items-center justify-center gap-2"><span>Verify & Continue</span> <i class="fa-solid fa-arrow-right"></i></button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.openStudentLoginModal = function() {
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                    <div class="glass-box w-full max-w-sm rounded-3xl p-6 space-y-4 relative border border-slate-700 shadow-2xl">
                        <button onclick="window.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
                        <h3 class="text-base font-bold text-white">Student Sign In</h3>
                        <p class="text-xs text-slate-400">Check 240-hour requirement progress, attendance log & metrics</p>
                        <div class="space-y-3 pt-2">
                            <input type="text" id="student-login-pin" placeholder="e.g. 25002-EC-026" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white uppercase">
                            <button onclick="window.verifyStudentLogin()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3.5 rounded-2xl shadow-lg transition cursor-pointer">Login to Dashboard</button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.verifyBoardLogin = function() {
            const pass = document.getElementById('login-passcode').value;
            if (pass === '1947') {
                currentUser = {
                    role: 'board',
                    name: document.getElementById('login-name').value,
                    pin: document.getElementById('login-pin').value,
                    designation: document.getElementById('login-desig').value
                };
                localStorage.setItem('nss_current_user', JSON.stringify(currentUser));
                window.closeModal();
                renderUI();
            } else { alert('Invalid passcode!'); }
        };

        window.verifyStudentLogin = async function() {
            const pin = document.getElementById('student-login-pin').value.trim().toUpperCase();
            const snap = await getDoc(doc(db, "students", pin));
            if(snap.exists()) {
                currentUser = { role: 'student', ...snap.data() };
                localStorage.setItem('nss_current_user', JSON.stringify(currentUser));
                window.closeModal();
                renderUI();
            } else { alert('Student PIN not found.'); }
        };

        window.closeModal = function() { document.getElementById('modal-container').innerHTML = ''; };
        window.logout = function() { currentUser = null; localStorage.removeItem('nss_current_user'); renderUI(); };
    </script>
</body>
</html>
